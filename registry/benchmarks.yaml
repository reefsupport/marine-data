# Public benchmark registry for decontamination + upstream-split honouring (WP-11). Design: docs/design/eval-decontamination-split-v2.md
# Schema (every entry):
#   id, name, task (cls|det|inst-seg|sem-seg|points|vqa|enhancement|salient|depth), catalog_id (S57 TSV id), registry_id (registry/sources id | null)
#   upstream_split: {rule, eval_split (the split papers report on), heldout_val (2nd held-out split pinned to our val | null), counts {split: n | null}, definition_url}
#   split_verified: true only if the split files/counts were seen in upstream metadata; verified_by: what was seen (2026-09-25)
#   obtain: {status: staged|registry-only|w1|w2|w3|needs-yohan|unfetchable, via}
#   policy: route-to-our-test | exclude ; policy_reason ; chain: S57 duplicate chains (c1 coralnet, c3 fathomnet, c5 j-edi debris,
#   c6 fish-det, c7 instance pools, c9 hf-mirror-vs-original, c11 enhancement raw-image sharing)
schema_version: 1
thresholds:   # §2.1; changing any value changes benchmarks_sha256 and therefore the split-map hash
  s3_dhash64_candidate_max: 12
  s3_phash256_confirm_max: 32
  s3_phash256_review_max: 48
  s3_min_entropy_bits: 4.0
  s4_embedding_model: sscd_disc_mixup   # D-V: decon copy-detection uses WP-10's SSCD, not dinov2
  s4_embedding_revision: 9f26bd4c848cc19b73d2ae92eea6e04886f61a7b764ceb7a13aeee62e6a6db56
  s4_tau_dedup: 0.93          # placeholder until WP-10's precision-95 calibration; record its report sha256 below
  s4_tau_dedup_calibration_sha256: null
  s4_tau_decon_offset: -0.03  # tau_decon = clamp(tau_dedup + offset, 0.85, 0.95) = 0.90 now
  s4_review_width: 0.05
  s4_ann_top_k: 10
  s5_parent_ncc_min: 0.90
  s5_parent_ncc_review_min: 0.80
  gate_review_band_max: {absolute: 5, fraction_of_eval: 0.01}
  gate_manifest_min_coverage: 0.99
benchmarks:
  - {id: coralscapes, name: Coralscapes, task: sem-seg, catalog_id: coralscapes, registry_id: coralscapes,
     upstream_split: {rule: "HF splits train/validation/test", eval_split: test, heldout_val: validation, counts: {train: 1517, validation: 166, test: 392}, definition_url: "https://huggingface.co/datasets/EPFL-ECEO/coralscapes"},
     split_verified: true, verified_by: "datasets-server /size: 1517/166/392", obtain: {status: staged, via: "sources/coralscapes/1.0"},
     policy: route-to-our-test, policy_reason: "we carry sem-seg; test must stay comparable", chain: []}
  - {id: suim, name: SUIM, task: sem-seg, catalog_id: suim, registry_id: suim,
     upstream_split: {rule: "dir SUIM/train_val (1525) vs SUIM/TEST (110)", eval_split: TEST, heldout_val: null, counts: {train_val: 1525, test: 110}, definition_url: "https://huggingface.co/datasets/SatwikKambham/suim/blob/main/suim.py"},
     split_verified: true, verified_by: "suim.py _split_generators + description", obtain: {status: w2, via: "HF mirror SatwikKambham/suim (IRVLab 403)"},
     policy: route-to-our-test, policy_reason: "sem-seg task layer", chain: [c7, c9]}
  - {id: uieb, name: UIEB, task: enhancement, catalog_id: uieb, registry_id: uieb,
     upstream_split: {rule: "no official split in the paper; community T90 = 90 of the 890 paired, plus C60 challenging (no reference)", eval_split: test, heldout_val: null, counts: {train: 800, test: 90, challenging: 60}, definition_url: "https://huggingface.co/datasets/Hikari0608/UIEB"},
     split_verified: true, verified_by: "mirror datasets-server 800/90 (a convention, not upstream)", obtain: {status: registry-only, via: "hf://datasets/Hikari0608/UIEB"},
     policy: route-to-our-test, policy_reason: "T90 and C60 both pinned to test (covers both protocols)", chain: [c11]}
  - {id: euvp, name: EUVP, task: enhancement, catalog_id: euvp, registry_id: null,
     upstream_split: {rule: "test_samples/ folder of the original release", eval_split: test_samples, heldout_val: null, counts: {test_samples: 515}, definition_url: "https://irvlab.cs.umn.edu/resources/euvp-dataset"},
     split_verified: false, verified_by: "IRVLab 403 to scripts; HF mirror Ken1053/EUVP has train only (5550 rows) — re-checked 2026-09-25 via datasets-server /splits, still no test_samples split published anywhere reachable", obtain: {status: w2, via: "original release, not the partial HF mirror"},
     policy: route-to-our-test, policy_reason: "enhancement pairs", chain: [c9, c11]}
  - {id: deepfish, name: DeepFish, task: cls, catalog_id: deepfish, registry_id: deepfish,
