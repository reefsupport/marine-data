# NOAA PIFSC-ESD coral bleaching dataset → RS-Benthic v1, condition axis.
#
# Binary classification: CORAL (healthy) vs CORAL_BL (bleached) — the two class
# directories the repo's own file tree carries (confirmed live 2026-08-28; the
# datasets-server rows API exposes no label column for this repo at all, so this is
# read from the directory structure via fetch_style: files).
#
# RE-CHECKED 2026-09-24 (WS-D S29): the dataset card's own "### Labels" table names
# CORAL "Healthy Hard Coral" outright — not "not bleached", not "unassessed" — so the
# CORAL edge is exact, not a coarsening. Card quote: "| Label | Name | Functional
# Group |\n|----------|----------------------|------------------|\n| CORAL | Healthy
# Hard Coral | Hard Coral |\n| CORAL_BL | Bleached Hard Coral | Hard Coral |", and
# prose: "specifically identifying **healthy hard coral (CORAL)** and **bleached hard
# coral (CORAL_BL)**." (https://huggingface.co/datasets/NMFS-OSI/NOAA-PIFSC-ESD-CORAL-Bleaching-Dataset,
# revision 8175d66ef0346795ace415b8b3950ee612ae1463).
#
# REVISED (WP-7d, vocabulary 2.0.0, manager decision 2026-09-25): CORAL -> HEALTHY is
# now `coarsened`, not `exact`. The card names the class "Healthy Hard Coral", but the
# dataset is a binary bleached/not-bleached split: no other condition (pale, diseased,
# dead) was ever assessed, so what the label actually asserts is "not bleached". That is
# the same situation as Roboflow's `Healthy` and Reef Support's `non_bleached`, and one
# rule now covers all three (tests/test_taxonomy.py asserts they agree).

crosswalks:
  - id: noaa-pifsc-bleaching-condition
    source_schema: dataset-native
    target_schema: rs-benthic-v1
    description: Directory-name labels onto RS-Benthic's condition axis.
    edges:
      - { source_label: "CORAL_BL", targets: { condition: BLEACHED }, fidelity: exact,
          note: "Card: \"| CORAL_BL | Bleached Hard Coral | Hard Coral |\"." }
      - { source_label: "CORAL", targets: { condition: HEALTHY }, fidelity: coarsened,
          note: "Card: \"| CORAL | Healthy Hard Coral | Hard Coral |\", but the split is
          binary (CORAL vs CORAL_BL), so the class only asserts 'not bleached'. Same rule
          as Roboflow 'Healthy': coarsened, never exact (WP-7d, 2.0.0; was exact)." }
