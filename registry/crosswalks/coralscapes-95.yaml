# coralscapes-95 -> rs-benthic-v1: Coralscapes V2 (95 classes) into the canonical label space.
#
# Class list and the 'Legacy (39-class)' column come from the dataset card of josauder/coralscapesV2 at revision
# 8a4567b2fbec14882e09aebff63a7a1ca5e24dca (card dated 2026-09-15). One edge per card id 1-95, in id order.
# Id 0 is the unlabelled value of the masks: it has no edge and is the ignore value (255 in training views),
# declared in registry/label-schemes/sources.yaml.
#
# Every note starts with [legacy: <name>], the card's Legacy (39-class) value: the coralscapes-39 class the pixels belonged to
# in V1 (the card writes 'hard substrate' where coralscapes-39 says 'unknown hard substrate'). The registry models forbid
# extra keys, so the legacy column lives in the note. tests/test_crosswalk_coralscapes_95.py pins the table, the fidelity
# counts and the refinements below.
#
# Rules, in priority order:
#   a  explicit nodes (soft corals, black coral, leather coral, Xeniidae, Nephtheidae, Acanthaster, dark, transect line,
#      water column / surface / background, human-made structure, human)
#   b  genus-named class with its own rs-benthic-v1 node -> that node, condition from the suffix (alive HEALTHY,
#      bleached BLEACHED, dead OLD_DEAD); family-named class -> its node, or HC (coarsened) when there is none;
#      a family never maps to a genus node
#   c  algae covered ... -> DCA approximate (the coralscapes-39 convention)
#   d  otherwise the coralscapes-39 edge of the legacy class, unchanged
#
# Refinements of the legacy edge, by card id:
#   rule a (changed): 21, 40-41, 54, 76-77, 95
#   rule b (own node): 3-4, 26-31, 33-34, 52-53, 59-61, 63-67, 80-81, 92
#   rule b (sibling edge): 83
#   rule b (HC, coarsened): 42-44, 73-75
# Unchanged legacy edges: rule d 1-2, 13-20, 22-25, 32, 35-39, 45-51, 55-58, 62, 68-72, 78-79, 82, 84-91, 93-94; rule c 5-12.
#
crosswalks:
  - id: coralscapes-95
    source_schema: coralscapes-95
    target_schema: rs-benthic-v1
    description: >
      Coralscapes V2 (95 classes, dataset card revision 8a4567b2) into rs-benthic-v1. One edge per card id 1-95 in id order;
      id 0 (unlabelled) is the ignore value and has no edge. Explicit rs-benthic-v1 nodes where one exists, the health suffix sets
      the condition, algae covered classes map to DCA, and every other class inherits the coralscapes-39 edge of its legacy class.
      Each note starts with [legacy: <name>], the card's Legacy (39-class) value. A family-named class never maps to a genus node.
    edges:
      - { source_label: "acanthaster planci", targets: { taxon: COTS }, fidelity: exact, note: "[legacy: crown of thorn]" }
