      - { source_label: "acropora bleached", targets: { taxon: HC_ACROPORA, condition: BLEACHED }, fidelity: exact, note: "[legacy: branching bleached] Own node HC_ACROPORA; condition from the name suffix, growth form not asserted." }
      - { source_label: "acropora dead", targets: { taxon: HC_ACROPORA, condition: OLD_DEAD }, fidelity: exact, note: "[legacy: branching dead] Own node HC_ACROPORA; condition from the name suffix, growth form not asserted." }
      - { source_label: "algae covered brain coral", targets: { taxon: DCA }, fidelity: approximate, note: "[legacy: algae covered substrate] DCA implies dead coral beneath; the source only asserts algal cover." }
