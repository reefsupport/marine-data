# Declared bridges (taxonomy 3.0.0, R3, design 3.1). Each edge is a rs-taxa-v1 subtree ROOT with the same AphiaID on both sides
# (exact; tests/test_taxonomy.py checks it). Every rs-taxa-v1 descendant of the root reaches the same target as coarsened.
crosswalks:
- id: rs-taxa-to-rs-benthic
  source_schema: rs-taxa-v1
  target_schema: rs-benthic-v1
  description: 'Declared bridges from rs-taxa-v1 subtree roots to rs-benthic-v1 classes: Scleractinia -> HC, Octocorallia -> SC, Actinopterygii -> FISH.'
  edges:
  - source_label: Scleractinia
    source_label_id: A1363
    targets: {taxon: HC}
    fidelity: exact
    note: 'AphiaID 1363 on both sides; genera and species below coarsen to HC'
  - source_label: Octocorallia
    source_label_id: A1341
    targets: {taxon: SC}
    fidelity: exact
    note: 'AphiaID 1341 on both sides; genera and species below coarsen to SC'
  - source_label: Actinopterygii
    source_label_id: A10194
    targets: {taxon: FISH}
    fidelity: exact
    note: 'AphiaID 10194 on both sides; species below coarsen to FISH'
