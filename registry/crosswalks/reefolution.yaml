# Hand-authored (WP-7b, completed WP-7c for taxonomy 1.2.0). Codes come from the staged
# sources/reefolution/2026-09-23-2c84cb0c9cda/labels/points.parquet (43,500 points, 64 codes
# observed, anonymous HTTPS GET 2026-09-25). Meanings come from the source's own label set:
# `labelset.csv` (CoralNet Label ID -> Short Code; rs-storage-private
# cache/reefolution/2026-09-23-2c84cb0c9cda/, md5 c684d673) joined to each label's public
# CoralNet page https://coralnet.ucsd.edu/label/<id>/ (name, functional group, definition),
# fetched at <= 2 req/s on 2026-09-25. Taxon names then resolve through the pinned WoRMS
# snapshot. Every edge note quotes the CoralNet label id it rests on where the code alone is
# ambiguous. Point counts per code: registry/taxonomy/vocab/reefolution.tsv.
#
# WP-7b left 24 codes unmapped (37.8% of points) because only the abbreviations were known.
# The label ids resolve all 24 (e.g. Xendae = label 1175 "XENIIDAE", Gonio = 130 "Goniopora",
# not Goniastrea, which is Gonia = 117). WP-7c also corrected five WP-7b edges that claimed a
# node did not exist when it did (Mil, Hal, Urchins, Anemone) or misread the code (GA = 4095
# "Chlorophyta", not generic algae).
crosswalks:
  - id: reefolution
    source_schema: dataset-native
    target_schema: rs-benthic-v1
    description: Reefolution's CoralNet-native genus/functional-group codes onto RS-Benthic v1, taxon (+form) axes.
    edges:
      - { source_label: Sand, targets: { taxon: SD }, fidelity: exact }
      - { source_label: TA, targets: { taxon: TA }, fidelity: exact }
      - { source_label: Acr, targets: { taxon: HC_ACROPORA }, fidelity: exact }
