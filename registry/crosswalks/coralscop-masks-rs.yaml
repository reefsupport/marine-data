# Hand-authored (WP-7b), verified against the real staged data 2026-09-25: fetched
# sources/coralscop-masks-rs/2026-09-23-3e8612678469/metadata.parquet (38,928 rows) via
# boto3 — columns are stem/partition/upstream_path/upstream_split/width/height/
# split_group. There is NO label column: CoralSCOP (registry description "Masks
# generated by the CoralSCOP model over an image pool") emits class-agnostic instance
# masks, one per detected coral, with no species or growth-form distinction. The
# implicit single class is "coral instance".
# RETARGETED (WP-7d, vocabulary 2.0.0, manager decision 2026-09-25): HC -> CNIDARIA.
# CoralSCOP is class-agnostic over hard AND soft coral, so HC (Scleractinia) asserted a
# taxon the source never distinguished. The edge now targets the coarsest node that
# contains both HC and SC. rs-benthic-v1 has no Anthozoa/"coral" node (HC, SC, MIL and
# ZO are direct children of CNIDARIA), so that node is CNIDARIA itself. MAJOR bump.
crosswalks:
  - id: coralscop-masks-rs
    source_schema: dataset-native
    target_schema: rs-benthic-v1
    description: CoralSCOP's class-agnostic coral instance masks onto the taxon axis.
    edges:
      - source_label: coral
        targets: { taxon: CNIDARIA }
        fidelity: coarsened
        note: "class-agnostic model output (no label column in metadata.parquet); every mask denotes one coral instance of unspecified taxon and growth form, hard or soft coral. CNIDARIA is the coarsest node holding both HC and SC (no Anthozoa node exists); was HC before 2.0.0"
