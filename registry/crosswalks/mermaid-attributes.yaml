# MERMAID benthic attributes -> RS-Benthic v1.
#
# MERMAID's vocabulary is not a labelset, it is a taxonomy: 259 attribute names, mostly
# genus and species, over one live corpus. Almost every edge here is therefore a roll-up,
# and `coarsened` is the normal case rather than a warning sign - the source is strictly
# more specific than the canonical schema below L3.
#
# Group membership was taken from WoRMS (AphiaRecordsByName, 2026-09-18), not from the
# name, because this vocabulary is full of homonyms that a reader would get wrong:
# `Turbinaria-algae` is a brown alga and `Turbinaria-coral` a scleractinian (MERMAID
# disambiguates them; `Turbinaria turbinata` is the alga and does NOT); `Lithophyllon` is
# a fungiid coral, not the coralline alga `Lithophyllum`; the species epithet in
# `Diploastrea heliopora` is not the octocoral genus `Heliopora`.
#
# Three groups have no L2 home and roll up to CNIDARIA rather than being forced:
# corallimorphs (Corallimorpharia, Discosoma, Coralimorph), hydroids (Hydroid,
# Aglaophenia) and the stylasterid hydrocoral Distichopora - MIL is Millepora-only.
#
# The `form` column of the staged points is NOT crossed into these labels. It stays
# native; see the source notes for why.

crosswalks:
  - id: mermaid-attributes
    source_schema: mermaid-attributes
    target_schema: rs-benthic-v1
    description: >
      All 259 MERMAID benthic attribute names in the live corpus onto the canonical
      axes. Genus and species labels roll up to their group node; two labels are
      explicitly unmappable. Taxon placement verified against WoRMS 2026-09-18.
    edges:
      - { source_label: "Macroalgae", targets: { taxon: SW }, fidelity: exact,
          note: "MERMAID's fleshy-macroalgae attribute is exactly RS-Benthic SW." }
      - { source_label: "Sand", targets: { taxon: SD }, fidelity: exact }
      - { source_label: "Rubble", targets: { taxon: RB }, fidelity: exact }
      - { source_label: "Turf algae", targets: { taxon: TA }, fidelity: exact }
      - { source_label: "Bare substrate", targets: { taxon: ABIOTIC }, fidelity: coarsened,
          note: "MERMAID scores Sand, Rubble and Silt as separate attributes, so this is most likely bare hard substrate - but the attribute does not exclude unconsolidated cover, so it rolls up to the ABIOTIC parent instead of guessing RK. Same call as the CoralNet crosswalk." }
      - { source_label: "Crustose coralline algae", targets: { taxon: CCA }, fidelity: exact }
      - { source_label: "Hard coral", targets: { taxon: HC }, fidelity: exact }
      - { source_label: "Porites", targets: { taxon: HC_PORITES }, fidelity: exact,
          note: "genus of Scleractinia (Poritidae) -> the Porites L3 node." }
      - { source_label: "Soft coral", targets: { taxon: SC }, fidelity: exact }
      - { source_label: "Acropora", targets: { taxon: HC_ACROPORA }, fidelity: exact,
          note: "genus of Scleractinia (Acroporidae) -> the Acropora L3 node." }
      - { source_label: "Dead coral", targets: { taxon: DC }, fidelity: approximate,
          note: "MERMAID scores 'Dead coral with algae' separately, so this is dead coral without algal cover; DC additionally asserts recency, which the attribute does not." }
      - { source_label: "Sargassum", targets: { taxon: SW }, fidelity: coarsened,
          note: "Ochrophyta macroalga (Fucales) -> SW." }
      - { source_label: "Tape", targets: { taxon: TWS }, fidelity: exact,
          note: "Transect tape - survey artefact, not benthos." }
      - { source_label: "Galaxea", targets: { taxon: HC }, fidelity: coarsened,
          note: "genus of Scleractinia (Euphylliidae) -> HC." }
      - { source_label: "Rock", targets: { taxon: RK }, fidelity: exact }
      - { source_label: "Pocillopora", targets: { taxon: HC_POCILLOPORA }, fidelity: exact,
          note: "genus of Scleractinia (Pocilloporidae) -> the Pocillopora L3 node." }
      - { source_label: "Cyanobacteria", targets: { taxon: NIA }, fidelity: approximate,
          note: "Cyanobacteria are bacteria, not algae; NIA is itself a functional (nutrient-indicator) node, so this is a functional match. Same call as AGRRA's CYAN." }
      - { source_label: "Montipora", targets: { taxon: HC }, fidelity: coarsened,
          note: "genus of Scleractinia (Acroporidae) -> HC." }
      - { source_label: "Dead coral with algae", targets: { taxon: DCA }, fidelity: exact }
