# Release-gate configuration, read by `marinedata release gate` (docs/GATES.md).
privacy:
  # EXIF GPS (privacy gate). An embedded image whose EXIF carries a GPSInfo IFD (tag 34853)
  # fails its row, unless its source id is set to true here. Allow a source only when its
  # licence and privacy review say the capture locations may be published with the pixels.
  #   allow_exif_gps:
  #     some-source-id: true
  # 2026-10-17 (D-EXIF default, reversible before publish; pending confirmation by yrunhaar):
  # seaview-survey-imagery publishes per-image lat/lon by design, so the one GPSInfo hit in the run-3
  # G8 scan (seaview image fc188688...) discloses nothing the source does not already publish.
  # Remove this line to make the gate fail such images again.
  allow_exif_gps:
    seaview-survey-imagery: true

labelmap:
  # G9 (v1.1.0): every class id in the exported label tables (label-map, points, bleaching, boxes,
  # semseg, instances) must resolve in this taxonomy release (registry/taxonomy/releases/<v>.json)
  # and in the per-source crosswalk, and every fidelity must be one of the words below.
  # taxonomy_version: null = the current registry taxonomy (registry/taxonomy/taxonomy.yaml).
  taxonomy_version: null
  fidelities: [exact, coarsened, approximate, unmappable]
