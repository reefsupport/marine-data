# Wikimedia Commons: files in 'Category:Underwater photographs' and every subcategory whose title contains 'nderwater' (depth <= 6).
id: wikimedia-underwater
adapter: commons-api
params:
  root_category: Underwater photographs
  subcat_contains: nderwater
  max_depth: 6
notes: 'Commons API walk, descriptive User-Agent, <=2 req/s; per-file licence + author in metadata.parquet; D-AB: in full'
