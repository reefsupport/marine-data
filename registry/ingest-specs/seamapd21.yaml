# seamapd21: 6-part split tar.gz (`cat *.aa..af > x.tar.gz`) on a plain HTTPS host.
# WP-6d-B added multipart-tar support (marinedata.adapters._group_multipart):
# `.tar.gz.aa`..`.af` parts are concatenated in upstream order with no full local copy,
# then decoded like an ordinary `.tar.gz`. Host timed out (000) from this machine on
# 2026-09-25 (D-R6 already flagged this); retry the live dry-run once it's reachable —
# this is a network issue, not a decoder gap.
id: seamapd21
adapter: http
license: public domain (US federal government work)
attribution: NOAA SEFSC — SEAMAPD21
citation: Boulais et al. 2021
homepage: https://github.com/SEFSC/SEAMAPD21
params:
  version: "1"
  urls:
    - https://grunt.sefsc.noaa.gov/parr/SEAMAPD21.tar.gz.aa
    - https://grunt.sefsc.noaa.gov/parr/SEAMAPD21.tar.gz.ab
    - https://grunt.sefsc.noaa.gov/parr/SEAMAPD21.tar.gz.ac
    - https://grunt.sefsc.noaa.gov/parr/SEAMAPD21.tar.gz.ad
    - https://grunt.sefsc.noaa.gov/parr/SEAMAPD21.tar.gz.ae
    - https://grunt.sefsc.noaa.gov/parr/SEAMAPD21.tar.gz.af
  label_patterns:
    - "*/labels/*.txt"
