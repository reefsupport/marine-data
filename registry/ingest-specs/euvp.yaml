# euvp: Islam et al. 2020, RA-L (FUnIE-GAN)
# HF mirror Ken1053/EUVP is PARTIAL (5,550 rows vs ~30k paired+unpaired); the IRVLab origin returns 403 to scripts. Stage the HF partial now; full set is needs_yohan (IRVLab bot-block) until someone fetches it via browser.
id: euvp
adapter: hf
license: research (non-commercial, per upstream)
attribution: Islam et al. — EUVP / FUnIE-GAN (HF mirror, partial)
citation: Islam et al. 2020, RA-L (FUnIE-GAN)
homepage: https://irvlab.cs.umn.edu/resources/euvp-dataset
params:
  repo: Ken1053/EUVP
  revision: main
  # BENCH-fix3 A: parquet has no plain image/img/jpg/png column, only a paired-edit
  # schema (input_image, edit_prompt, edited_image); hash BOTH sides — both are
  # benchmark eval images, so decon must treat either as contact — never code
  # special-casing the two column names.
  image_column: [input_image, edited_image]

disk_floor_gib: 36.0
