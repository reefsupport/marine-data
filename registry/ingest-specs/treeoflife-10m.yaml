# TreeOfLife-10M (Imageomics): 63 tar.gz shards; only ~5% marine, so stream every shard and keep matching members (member-filter).
# bioscan (insects) contributes 0 marine rows; inat21 rows duplicate iNat photos -> dedupe against inat-marine.
id: treeoflife-10m
adapter: needs:member-filter
license: HF card licence null; per image per upstream (EOL media licence, iNat21 photo licence) — not in the catalog.csv
  columns read
attribution: Imageomics Institute — TreeOfLife-10M (EOL, iNat21, BIOSCAN-1M)
citation: Stevens et al. 2024, CVPR, BioCLIP
homepage: https://huggingface.co/datasets/imageomics/TreeOfLife-10M
candidate_endpoints:
- hf://datasets/imageomics/TreeOfLife-10M@91debffb7146c32c89d76feb1eb575b555e2ecc7/dataset/*.tar.gz
- hf://datasets/imageomics/TreeOfLife-10M/metadata/catalog.csv
why_not_supported: Marine members are scattered across all 63 shards (1,984.9 GB); the hf adapter stages whole files.
  Needs a streaming member filter keyed by catalog.csv rows.
measured:
  items: 10988032
  bytes: 1984907071025
  method: metadata/catalog.csv full pass (10,988,032 rows) + HF tree @91debff (63 dataset/*.tar.gz)
  date: '2026-09-25'
  bytes_basis: hf-tree
  by_data_source:
    eol: 6810437
    bioscan: 1235502
    inat21: 2942093
  marine_by_source_and_rule:
    eol|worms-species: 334348
    eol|clade: 131302
    inat21|clade: 32058
    inat21|worms-species: 79412
  label_type: cls (7-rank taxonomy)
subset:
  target_items: 571962
  stratify:
  - data_source
  - species
  cap_per_stratum: 500
  rule: catalog.csv rows in 34 wholly-marine clades or whose binomial is an iNat/WoRMS-marine species (577,120 rows),
    <= 500 per (data_source, species); mixed-clade rows without a marine binomial are excluded (lower bound)
