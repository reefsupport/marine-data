# GBIF occurrences with StillImage media in wholly-marine clades, EXCLUDING iNaturalist (inat-marine covers it) and specimens/fossils.
id: gbif-marine
adapter: needs:gbif-occurrence-media
license: 'per record: CC0-1.0 / CC-BY-4.0 / CC-BY-NC-4.0 (GBIF licence facet)'
attribution: GBIF.org and the publishing institutions
citation: GBIF.org occurrence search, 2026-09-25
homepage: https://registry.opendata.aws/gbif/
candidate_endpoints:
- https://api.gbif.org/v1/occurrence/search (media[].identifier; partition by datasetKey x year to stay < 100k offset)
- s3://gbif-open-data-eu-central-1/occurrence/ (parquet; mediatype only)
why_not_supported: Image URLs live in each record's media[] and point at thousands of publisher hosts; the anonymous
  route is the paged search API (offset cap 100k -> partitioned queries). Downloads API needs a GBIF login (not
  used).
measured:
  items: 346842
  bytes: null
  method: 'GBIF occurrence/search facets: mediaType=StillImage, basisOfRecord in {HUMAN,MACHINE}_OBSERVATION, 16
    exact-matched marine clade keys, minus iNat datasetKey'
  date: '2026-09-25'
  bytes_basis: 'not in metadata: media are per-publisher URLs with no size field'
  unit: occurrences (>= 1 image each)
  context:
    marine_clades_all_basis: 2714201
    of_which_inat: 1727710
    licence_all_basis:
      CC_BY_NC_4_0: 1654628
      CC0_1_0: 625350
      CC_BY_4_0: 434223
    in_situ_incl_inat: 2074552
  caveat: 'fish excluded: GBIF backbone gave no exact match for Actinopterygii/Actinopteri; Ctenophora no match;
    Sirenia matched HIGHERRANK Mammalia and was dropped'
  label_type: cls (species, GBIF backbone)
subset:
  target_items: 346842
  stratify:
  - datasetKey
  - class
  rule: non-iNat in-situ occurrences, first image per occurrence; dedupe by occurrenceID/media URL against inat-marine
    and obis
