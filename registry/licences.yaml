# Licence definitions. Sources reference these by id.
#
# Tier answers "what class of permission?"; flags answer "what specific acts are barred?".
# Both are needed — CC-BY-NC and CC-BY-NC-ND share a tier but ND additionally forbids
# every derivative, which means masks, crops and augmentations. That is the difference
# between "research only" and "unusable for training".
#
# NOT LEGAL ADVICE.

licences:
  - id: PROPRIETARY-OWN
    name: Reef Support proprietary (rights held outright)
    tier: T0_OWN

  # ── Permissive ────────────────────────────────────────────────────────────
  - id: CC0-1.0
    name: Creative Commons Zero v1.0 Universal
    tier: T1_PERMISSIVE
    url: https://creativecommons.org/publicdomain/zero/1.0/

  - id: CC-BY-4.0
    name: Creative Commons Attribution 4.0
    tier: T1_PERMISSIVE
    url: https://creativecommons.org/licenses/by/4.0/
    flags: { attribution_required: true }

  - id: CC-BY-3.0
    name: Creative Commons Attribution 3.0 Unported
    tier: T1_PERMISSIVE
    url: https://creativecommons.org/licenses/by/3.0/
    flags: { attribution_required: true }
    notes: >
      Same permissions as CC-BY-4.0 for this registry's purposes (attribution only,
      no other restriction). Used for the Seaview survey photographs, whose UQ eSpace
      record (UQ:734799) states "Creative Commons Attribution 3.0 International (CC BY 3.0)".

  - id: CC-BY-3.0-AU
    name: Creative Commons Attribution 3.0 Australia
    tier: T1_PERMISSIVE
    url: https://creativecommons.org/licenses/by/3.0/au/
    flags: { attribution_required: true }
    notes: >
      Same permissions as CC-BY-4.0 for this registry's purposes (attribution only,
      no other restriction) — kept distinct for accurate citation, since OzFish's own
      repo README links the 3.0 AU port specifically, not 4.0 (its badge alt-text
      says "4.0" but the badge image and the link both say 3.0 — the source of the
      original mis-entry).

  - id: Apache-2.0
    name: Apache License 2.0
    tier: T1_PERMISSIVE
    url: https://www.apache.org/licenses/LICENSE-2.0
    flags: { attribution_required: true }

  - id: MIT
    name: MIT License
    tier: T1_PERMISSIVE
    flags: { attribution_required: true }

  - id: CDLA-Permissive-2.0
    name: Community Data License Agreement – Permissive 2.0
    tier: T1_PERMISSIVE
    flags: { attribution_required: true }

  - id: US-GOV-PD
    name: US Government work, public domain (17 U.S.C. §105)
    tier: T1_PERMISSIVE
    notes: >
      No copyright in the United States. Outside the US the position can differ; NOAA
      and NCCOS material is nonetheless distributed for unrestricted reuse.

  # ── Copyleft ──────────────────────────────────────────────────────────────
  - id: CC-BY-SA-4.0
    name: Creative Commons Attribution-ShareAlike 4.0
    tier: T2_COPYLEFT
    url: https://creativecommons.org/licenses/by-sa/4.0/
    flags: { attribution_required: true, share_alike: true }
    notes: >
      Permits commercial use. Whether trained weights are a derivative work is unsettled;
      releasing the weights under the same terms discharges the obligation either way.

  - id: GPL-3.0
    name: GNU General Public License v3.0
    tier: T2_COPYLEFT
    flags: { attribution_required: true, share_alike: true }

  # ── Non-commercial ────────────────────────────────────────────────────────
  - id: CC-BY-NC-4.0
    name: Creative Commons Attribution-NonCommercial 4.0
    tier: T3_NONCOMMERCIAL
    flags: { attribution_required: true }

  - id: CC-BY-NC-SA-4.0
    name: Creative Commons Attribution-NonCommercial-ShareAlike 4.0
    tier: T3_NONCOMMERCIAL
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
    flags: { attribution_required: true, share_alike: true }

  - id: CC-BY-NC-ND-4.0
    name: Creative Commons Attribution-NonCommercial-NoDerivatives 4.0
    tier: T3_NONCOMMERCIAL
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
    flags: { attribution_required: true, no_derivatives: true }
    notes: >
      ND blocks derivative works outright. Generating masks, crops, resizes or
      augmentations from an ND source is a derivative act. Treat as untrainable, not
      merely non-commercial — this is the most commonly missed restriction in the field.

  - id: RESEARCH-ONLY-NO-REDIST
    name: Custom research/academic-only grant, redistribution forbidden
    tier: T3_NONCOMMERCIAL
    flags: { attribution_required: true, no_derivatives: true }
    notes: >
      Not a Creative Commons licence — a bespoke first-party terms-of-use statement
      (UIEB, Watkins Marine Mammal Sound Database) granting personal/academic,
      non-commercial use with credit, and explicitly forbidding reposting or
      redistribution in any form. Modelled with `no_derivatives` even though the
      source text is about redistribution rather than derivative works specifically,
      because the practical effect is the same for this registry's purposes: it blocks
      mirroring, sharding and any downstream act broader than reading the original
      files in place for research. Citing this as CC-BY-NC-4.0 (which permits
      redistribution with attribution) would overstate the grant.

  # ── Reference data that ships next to the imagery (taxonomy, geography) ───
  # Not source licences: no registry source cites these ids. They hold the attribution terms the
  # `taxonomy` config and the per-row `meow_*` fields must carry.
  - id: WORMS-CC-BY-4.0
    name: World Register of Marine Species (WoRMS), CC BY 4.0
    tier: T1_PERMISSIVE
    url: https://www.marinespecies.org/about.php#terms
    flags: { attribution_required: true }
    notes: >
      WoRMS content (AphiaIDs, accepted names, ranks, classification) is published under CC BY 4.0, so
      shipping it needs the citation: WoRMS Editorial Board (year). World Register of Marine Species.
      Available from https://www.marinespecies.org at VLIZ. Accessed (date). doi:10.14284/170. Carry it on
      the `taxonomy` config and in any card or NOTICE that ships WoRMS-derived fields (`worms_aphia_id`,
      `worms_scientificname`, ranks, classification). The committed node is the pin, with the snapshot
      date (docs/TAXONOMY.md). Terms of use, read 2026-10-15 at the url above: "The text on the WoRMS
      pages is open-access under the terms of the Creative Commons Attribution License (CC-BY). This
      License permits unrestricted use, provided it is cited as requested on the WoRMS webpages, unless
      stated otherwise on the individual pages" (the page links the 4.0 deed,
      creativecommons.org/licenses/by/4.0/). Two limits from the same section:
      images are CC BY-NC-SA by default (no WoRMS image ships here), and "Re-distribution of the entire
      database is not permitted, unless by prior written agreement", so the `taxonomy` config carries the
      registry's own nodes only, never the register. Re-read the terms before each release.

  - id: MEOW-WORKING-GROUP
    name: Marine Ecoregions of the World (MEOW), Spalding et al. 2007
    tier: T3_NONCOMMERCIAL
    flags: { attribution_required: true }
    notes: >
      The data's own terms (registry/geo/SOURCES.md): no sale, distribution, loan or offering of the
      digital data "in whole or in part" without the MEOW Working Group's approval, and no GIS product made
      to sell for profit without its written consent. So the polygon geometry is never published; only the
      derived `meow_realm`, `meow_province` and `meow_ecoregion` strings ship. They carry the citation
      (Spalding MD et al. 2007, Marine Ecoregions of the World: a bioregionalization of coastal and shelf
      areas, BioScience 57: 573-583, doi:10.1641/B570707), acknowledge the MEOW Working Group and its
      members' organisations as data contributors, and state any modification of the original units.

  # ── No grant ──────────────────────────────────────────────────────────────
  - id: NO-LICENCE-STATED
    name: No licence published
    tier: T4_TDM_ONLY
    notes: >
      Publicly visible but with no grant of rights. Public visibility is not a licence.
      Any use rests on a statutory exception (EU: Art. 15o Auteurswet / DSM Art. 4),
      which requires lawful access and the absence of a machine-readable reservation.

  - id: PER-SOURCE-VARIES
    name: Licence varies per contributing source
    tier: T4_TDM_ONLY
    notes: >
      Aggregations where each contributor set its own terms. Must be resolved per subset
      before any shipping use; the aggregate tier is the floor, not the answer.

  # ── Prohibited ────────────────────────────────────────────────────────────
  - id: PROVENANCE-DEFECTIVE
    name: Licensor grants rights it does not appear to hold
    tier: TX_PROHIBITED
    flags: { provenance_defective: true }
    notes: >
      Typically stock or platform imagery redistributed under a CC licence by a third
      party. No permission from the redistributor can cure the underlying defect.
