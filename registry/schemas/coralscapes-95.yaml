# Coralscapes-95 — the CoralscapesV2 dataset's own label dictionary.
#
# Generated mechanically from `id2label.json` in the dataset's own HuggingFace repo:
#   https://huggingface.co/datasets/josauder/coralscapesV2/blob/main/id2label.json
# fetched 2026-09-11. Every id below is `CS95_<UPPER_SNAKE(name)>`; every `name` and
# `aliases` entry is copied verbatim from that file — nothing here was read off Fig. 5
# of the paper or hand-typed from the class table in the dataset card prose (that prose
# is stale, copy-pasted from the V1 card, and still says "39 benthic classes" — id2label.json
# is the only trustworthy source for this enumeration; see the coralscapes-v2 source entry's
# notes for how that was caught).
#
# Like coralscapes-39, this is a FLAT vocabulary by design — the source has no hierarchy.
# No crosswalk to coralscapes-39 exists here: the paper's Fig. 5a/5b shows the 95->39
# remap as a graphic only, and no machine-readable version of it was found in the dataset
# repo, the project homepage, the authors' training-code repos, or the production pipeline
# repo (deepreefmap). See the coralscapes-v2 source entry's notes for the full list of
# places checked. Hand-deriving that mapping from the figure would be exactly the fail-open
# this registry exists to prevent, so it is not attempted here.
#
# NOTE the gain over coralscapes-39: this schema DOES carry soft-coral classes absent from
# V1 — "leather coral alive", "nephtheidae alive", "xeniidae alive", a
# "soft coral (malacalcyonacea) alive/bleached" catch-all, and "cirrhipathes" (black/wire
# coral) — see the source entry's notes for why that still doesn't close the Caribbean gap.

schemas:
  - id: coralscapes-95
    name: Coralscapes 95-class
    description: >
      The flat 95-class scheme from the CoralscapesV2 dataset (Red Sea), superseding
      Coralscapes-39's 39 classes with finer taxon/form/condition splits and, new in V2,
      several soft-coral classes. Not a taxonomy — see the header comment for why no
      crosswalk to coralscapes-39 ships with this file.
    axes: [taxon]
    nodes:
      - { id: CS95_ACANTHASTER_PLANCI, name: "acanthaster planci", axis: taxon, aliases: ["acanthaster planci"] }
