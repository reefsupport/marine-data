# Reefolution's own CoralNet-style point-label vocabulary.
#
# Reefolution exports its own labelset (`labelset.csv`: CoralNet `Label ID` + `Short
# Code`) alongside its point annotations (`annotations.csv`: image, row, column,
# `Short Code`). The staged `labels/points.parquet` (S7b) stores the Short Code as
# each point's label, so this schema is keyed on Short Code to match the data on disk.
#
# Unlike `coralnet-labelset` (the small, stable CoralNet functional-group layer), this
# is Reefolution's full, source-specific vocabulary — 85 codes mixing coral genera
# (Acr, Poc, Pav, ...), other biota (Bivalve, Tunicate, Zoanthid, ...), substrate
# (Sand, Rubble, Rock) and equipment/quality flags (Frame, Unknown, dead). No crosswalk
# to a canonical scheme exists yet; this file only makes `schema_id:
# reefolution-coralnet-native` resolve and records the vocabulary honestly.

schemas:
  - id: reefolution-coralnet-native
    name: Reefolution CoralNet-style native labelset
    description: >
      Reefolution's partner-supplied CoralNet-style point-label vocabulary (85 short
      codes from its own `labelset.csv`). Dataset-native and unmapped — no crosswalk to
      a canonical scheme exists yet.
    axes: [taxon]
    nodes:
      - { id: "Aca", name: Aca, axis: taxon }
      - { id: "Acr", name: Acr, axis: taxon }
      - { id: "Agl", name: Agl, axis: taxon }
