# Shared native vocabulary for Roboflow's five independently-uploaded bleaching /
# coral-classification image sets (WS-D S23, R3 Q10): v3i, v6i, v1-yolov8s, v13i, v2i.
#
# v3i carries the binary Healthy/Unhealthy image-level judgement as a folder-per-class
# layout. v6i and v1-yolov8s (WS-D S25) ship a different one-hot `_classes.csv`
# vocabulary instead — `Bleached`/`Healthy`, not `Healthy`/`Unhealthy` — and are
# genuinely multi-label per image (both columns can be 1 on the same row: 1,098/2,551
# v6i images, 1,072/2,543 v1-yolov8s images carry both). One shared schema instead of
# per-source ones, same reasoning as the shared `roboflow-bleaching/{group}`
# split_group template these sources already use.
#
# "Unhealthy" is a Roboflow contributor's own binary call, not a diagnosis: it does not
# distinguish pale, diseased, recently-dead or long-dead coral. "Bleached" is the
# contributor's own specific call — the source literally names the class "Bleached" —
# so it crosswalks exactly onto the BLEACHED leaf, never coarsened. See the
# `roboflow-bleaching-condition` crosswalk for how each of these maps onto
# `rs-benthic-v1`'s condition axis.

schemas:
  - id: roboflow-bleaching-native
    name: Roboflow bleaching-classification native labelset
    description: >
      The shared image-level vocabulary across Roboflow's five bleaching/coral-
      classification exports (v3i, v6i, v1-yolov8s, v13i, v2i): v3i's binary
      Healthy/Unhealthy folder classes, plus v6i/v1-yolov8s's one-hot
      Bleached/Healthy `_classes.csv` columns (WS-D S25). Dataset-native, unmapped to
      any finer condition scale — this only makes schema_id: roboflow-bleaching-native
      resolve and records the vocabulary honestly.
    axes: [condition]
    nodes:
      - { id: "Healthy", name: Healthy, axis: condition }
      - { id: "Unhealthy", name: Unhealthy, axis: condition }
      - { id: "Bleached", name: Bleached, axis: condition }
