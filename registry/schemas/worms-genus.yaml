# WoRMS genus names as labels — an OPEN vocabulary.
#
# Unlike every other schema here, this one is not closed and never will be: WoRMS holds
# ~240,000 accepted marine species and any of their genera could appear as a label. The
# nodes below are the genera our registry actually anchors, each with a verified AphiaID.
#
# The right way to extend it is `marinedata taxa add <name>`, which resolves against
# OBIS/WoRMS and writes the frozen fields. Do not hand-type AphiaIDs: three of the first
# eight entered that way here were wrong, one pointing at a red alga and one at a
# bryozoan, and a bare integer looks identical whether it is right or not.
#
# Sources labelled at genus rank (ReefNet, parts of CoralNet) harmonise through this.

schemas:
  - id: worms-genus
    name: WoRMS genus
    description: >
      Genus-rank labels resolved against the World Register of Marine Species. Open
      vocabulary; the node list is what we have anchored, not what exists.
    axes: [taxon]
    nodes:
      - { id: "Acanthaster", name: Acanthaster, axis: taxon, worms_aphia_id: 205212, worms_scientificname: Acanthaster, worms_rank: Genus, worms_status: accepted, worms_checked_on: 2026-08-17 }
