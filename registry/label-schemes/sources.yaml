  reef-support-benthic-own:
    repo: reefsupport/marine-data
    config: coral-masks
    kind: semantic
    crosswalk: reef-support-labelbox
    dense: false
    note: "255 = unannotated (NOT background): only Hard/Soft Coral were painted; MIL/OSI regions are 255 too. No coral condition is recorded: HC may include recently dead colonies, and the default dead-coral exclusion cannot apply"
    ids:
      1: "Hard Coral"
      2: "Soft Coral"
  reef-support-seaview-labels:
    repo: reefsupport/marine-data
    config: coral-masks
    kind: semantic
    crosswalk: reef-support-labelbox
    dense: false
    note: "255 = unannotated (NOT background): only Hard/Soft Coral were painted; MIL/OSI regions are 255 too. No coral condition is recorded: HC may include recently dead colonies, and the default dead-coral exclusion cannot apply"
    ids:
      1: "Hard Coral"
      2: "Soft Coral"
  coralseg-ucsd-mosaics:
    repo: reefsupport/marine-data-nc
    config: coral-masks
    kind: semantic
    crosswalk: coralseg-ucsd-mosaics
    dense: true
    note: "Other (0) is the residual non-coral bucket; every pixel is annotated"
    ids:
      0: "Other"
      1: "Hard Coral"
      2: "Soft Coral"
  coralscop-masks-rs:
    repo: reefsupport/marine-data-nc
    config: coral-masks-machine
    kind: semantic
    crosswalk: coralscop-masks-rs
    dense: false
    note: "class-agnostic machine masks: 1 = coral instance, 255 (source 0) = not detected, which is NOT a verified negative"
    ids:
      1: "coral"
  suim:
    repo: reefsupport/marine-data
    config: scene-masks
    kind: semantic
    crosswalk: suim-8class
    dense: true
    note: "all pixels carry one of the 8 SUIM classes"
    ids:
      0: "BW"
      1: "HD"
      2: "PF"
      3: "WR"
      4: "RO"
      5: "RI"
      6: "FV"
      7: "SR"
  uiis:
    repo: reefsupport/marine-data
    config: instance-masks
    kind: instances
    crosswalk: usis-uiis
    dense: false
    note: "instances; unlabelled pixels are unannotated, not background"
    labels: ["aquatic plants", "fish", "human divers", "reefs", "robots", "sea-floor", "wrecks/ruins"]
    box_config: fish-boxes
  uiis10k:
    repo: reefsupport/marine-data
    config: instance-masks
    kind: instances
    crosswalk: usis-uiis
    dense: false
    note: "instances; unlabelled pixels are unannotated, not background"
    labels: ["arthropoda", "corals", "fish", "garbage", "human", "mollusk", "plants", "reptiles", "robots", "ruins"]
    box_config: fish-boxes
  usis10k:
    repo: reefsupport/marine-data
    config: instance-masks
    kind: instances
    crosswalk: usis-uiis
    dense: false
    note: "instances; unlabelled pixels are unannotated, not background"
    labels: ["aquatic plants", "fish", "human divers", "reefs", "robots", "sea-floor", "wrecks/ruins"]
    box_config: fish-boxes
  roboflow-aquarium:
    repo: reefsupport/marine-data
    config: fish-boxes
    kind: boxes
    crosswalk: roboflow-aquarium
    dense: false
    note: "boxes only"
    labels: ["fish", "jellyfish", "penguin", "puffin", "shark", "starfish", "stingray"]
