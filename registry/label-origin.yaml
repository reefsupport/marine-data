# label_origin per (source, label set) — WP-9, 2026-09-25.
#
# origin ∈ human_expert | human_crowd | pseudo_model | derived_rule | unknown
#   human_expert  trained annotators (scientists/analysts) with a documented protocol
#   human_crowd   community uploads (e.g. Roboflow Universe); annotator and QA unknown
#   pseudo_model  produced by a model, not verified by a human
#   derived_rule  a deterministic rule over another label set (``from`` names it)
#   unknown       no evidence either way
# confidence: how sure the ORIGIN call is (not the label accuracy). "measured" lines cite
# docs/label-quality.md. WP-2 wires this into `metadata.label_origin` at the merge;
# models.py and hf_* are deliberately not edited here (D-M).
version: 1
entries:
  - source: coralscop-masks-rs
    label_set: masks (CoralSCOP instance masks)
    origin: pseudo_model
    confidence: high
    evidence: >-
      registry/sources/reef-support-own.yaml: "Masks generated by the CoralSCOP model over an
      image pool. Model output, not verified". Already segregated as pseudo-masks in v1.

  - source: noaa-pifsc-bleaching
    label_set: image_labels (CORAL, CORAL_BL)
    origin: human_expert
    confidence: medium
    evidence: >-
      NOAA PIFSC Ecosystem Sciences Division, purpose-built bleached-vs-healthy set (US-Gov PD).
      Registry S29: files are 224x224 tile crops of larger survey photos; the CORAL/CORAL_BL
      codes are NOAA benthic-analyst codes. Annotator training is not stated in the source
      itself — confirm with the PIFSC data documentation before citing "expert".

  - source: reef-support-benthic-own
    label_set: masks + points (Labelbox)
    origin: human_expert
    confidence: high
    evidence: >-
      registry: "Expert Labelbox instance masks over four Colombian sites where BOTH the
      imagery and the annotations are ours".

  - source: reef-support-bleaching
    label_set: condition raster (1 bleached / 2 non-bleached)
    origin: human_expert
    confidence: medium
    evidence: >-
      Our own UNAL_BLEACHING_TAYRONA tree over the same 658 Tayrona images as the expert
      benthic masks. The annotators are not named in the registry — Yohan to confirm.

  - source: roboflow-coral-bleaching-final-v6i
    label_set: image_labels (Healthy, Bleached, Non-Corals)
    origin: human_crowd
    confidence: high
    evidence: >-
      Roboflow Universe upload (Lockie, "Coral Bleaching Final" v6), CC-BY-4.0, no annotation
      protocol published. Measured: shares footage and labels with v1-yolov8s (same uploader);
      1 identical file carries two different labels inside this one source.

  - source: roboflow-coral-bleaching-general-v1-yolov8s
    label_set: image_labels (Healthy, Bleached, Non-Corals)
    origin: human_crowd
    confidence: high
    evidence: >-
      Roboflow Universe upload (Lockie, "Coral Bleaching_General" v1). "YOLOv8s" names the
      Roboflow training run, not a model-labelled export. Same uploader and footage as v6i:
      99.4% agreement on shared dHash-0 images, so the two are one annotation lineage, not two
      independent raters.

  - source: roboflow-coral-classification-copy-changed-v13i
    label_set: image_labels (Healthy, Bleached, Non-Corals)
    origin: human_crowd
    confidence: high
    evidence: >-
      Roboflow Universe fork (maxyn-icaonapo, "Coral Classification Copy (Changed)" v13): a
      copy of another project with labels edited. Measured: 3 of the 14 identical-sha conflicts
      are v13i "Bleached" on visibly pigmented brain coral that v1 calls Healthy.

  - source: roboflow-coral-reef-bleach-detection-v2i
    label_set: image_labels (Healthy, Bleached)
    origin: human_crowd
    confidence: high
    evidence: >-
      Roboflow Universe upload (coralreef, "Coral Reef Bleach Detection" v2), detection project;
      image labels are the per-image class set from Roboflow's classes CSV export.

  - source: roboflow-coral-reef-classification-v3i
    label_set: image_labels (Healthy, Unhealthy; folder layout)
    origin: human_crowd
    confidence: high
    evidence: >-
      Roboflow Universe folder-layout upload (twork, "Coral Reef Classification"). "Unhealthy"
      is a different concept from "Bleached": measured agreement with the bleaching family on
      shared images is 73-79%, versus ≥ 99% inside that family.

  # Task-level labels in the release are rules over the entries above.
  - source: "*"
    label_set: coral-health-binary UNHEALTHY "rolled up from BLEACHED"
    origin: derived_rule
    from: the source's image_labels (Bleached / CORAL_BL)
    confidence: high
    evidence: HF build label_reason column; 11,960 rows carry this reason.

  - source: "*"
    label_set: bleaching-condition / coral-health-binary label_reason "exact"
    origin: derived_rule
    from: the source's image_labels via registry/crosswalks (1:1 rename)
    confidence: high
    evidence: HF build label_reason column. Inherit the upstream origin for noise purposes.
