# Split v2 rules — design/eval-decontamination-split-v2.md §3.
# Precedence for the OOD holdouts is list order: the first rule (by `order`) any member of
# a `split_group_id` matches wins that group's split; every matching rule is recorded.
# Changing anything in this file changes `rules_sha256` and therefore SPLIT_MAP v2's
# `map_sha256` (§3.5).
schema_version: 2
seed: 0

ratios:
  train: 0.70
  val: 0.15
  test: 0.15

min_groups: 3 # strata below this are train-only (strata.DEFAULT_MIN_GROUPS)

tolerance:
  overall_pt: 1.5
  stratum_min_groups: 20
  stratum_pt: 2.0
  coarse_min_pt: 2.0 # coarse stratum tolerance = max(coarse_min_pt, largest-group share pt)

size_guards:
  min_images: 500
  min_groups: 5
  max_holdout_share: 0.10
  max_total_holdout_share: 0.25

allocator:
  overshoot_cap: 1.10
  repair_max_swaps: 200

# The 7 OOD holdouts, in precedence order (§3.2 + charter D-P(1), 2026-09-25, which
# added #4 after the design doc was written). `kind` selects the comparison:
#   source_eq   — source_id == value
#   field_eq    — field == value, filling nulls from `fallback` first
#   field_gte   — field >= value, filling nulls from `fallback` first
# `fallback` names a per-source lookup table below (`geo_fallback`, `platform_fallback`,
# `source_min_depth_m`); `widen_values` is the one-time rescue §3.2 describes for #6.
# `data_driven: true` means `value` is not authored here — `splits check` resolves it
# at run time from the labelled pool (`marinedata.splitv2.dp_province`) and the yaml
# `value` stays null until then, which never matches anything on its own.
holdouts:
  - name: ood-source-deepfish
    order: 1
    kind: source_eq
    value: deepfish
  - name: ood-geo-temperate-australasia
    order: 2
    kind: field_eq
    field: meow_realm
    value: "Temperate Australasia"
    fallback: geo_fallback
    fallback_key: realm
  - name: ood-geo-mediterranean
    order: 3
    kind: field_eq
    field: meow_province
    value: "Mediterranean Sea"
    fallback: geo_fallback
    fallback_key: province
  - name: ood-geo-tropical-province
    order: 4
    kind: field_eq
    field: meow_province
    value: null
    fallback: geo_fallback
    fallback_key: province
    data_driven: true
  - name: ood-depth-deep
    order: 5
    kind: field_gte
    field: depth_m
    value: 800
    fallback: source_min_depth_m
  - name: ood-platform-auv
    order: 6
    kind: field_eq
    field: platform
    value: auv
    fallback: platform_fallback
    widen_values: [auv, towed]
  - name: ood-time-2025
    order: 7
    kind: field_gte
    field: capture_datetime
    value: "2025-01-01T00:00:00+00:00"
    requires_bimodal_source: true

# D-P(1) candidate realms for `ood-geo-tropical-province`: the tropical MEOW realms
# OUTSIDE the Tropical Atlantic (our own operating area, which D-P explicitly keeps
# out of this holdout — enforced again, hard-coded, in `dp_province.EXCLUDED_REALM`
# so a future edit here can never accidentally route our own imagery OOD).
tropical_realms:
  - Central Indo-Pacific
  - Western Indo-Pacific
  - Eastern Indo-Pacific
  - Tropical Eastern Pacific

# Per-source fallback used to fill a null meow_realm/meow_province before the geography
# rules test it — never invented, only sources known single-realm/-province (§3.2).
geo_fallback:
  deepseagrass: {realm: "Temperate Australasia"}
  benthoz15: {realm: "Temperate Australasia"}
  obsea-fish: {province: "Mediterranean Sea"}
  seaclear-marine-debris: {province: "Mediterranean Sea"}
  posidonia: {province: "Mediterranean Sea"}
  med-fish: {province: "Mediterranean Sea"}
  mlc-moorea: {province: "Eastern Indo-Pacific"}
  coralscapes: {province: "Western Indo-Pacific / Red Sea and Gulf of Aden"}
  noaa-pifsc-bleaching: {province: "Eastern Indo-Pacific / Hawaii"}
  reef-support-benthic-own: {realm: "Tropical Atlantic"}

# Per-source single-platform fallback (empty until a source is confirmed single-platform).
platform_fallback: {}

# Per-source nominal minimum depth in metres, for #4's fallback (empty until confirmed).
source_min_depth_m: {}
