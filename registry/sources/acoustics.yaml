# Reef and marine bioacoustics.
#
# The cheapest continuous-monitoring modality, and the one place in marine ML where a
# genuine foundation model already exists. The counter-intuitive finding worth knowing:
# bird-pretrained networks outperform marine-specific ones on marine transfer, so the
# leverage here is in adopting Perch rather than collecting marine-only audio.

sources:
  - id: reefset-v1
    name: ReefSet v1.0
    version: "1.0"
    description: >
      The reef-bioacoustics training set behind SurfPerch — labelled reef sound clips
      from Indonesia, Australia and the "Calling in Our Corals" citizen-science project.
    licence: CC-BY-4.0
    legal_basis: licence
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "Zenodo record 11071202 — CC-BY 4.0"
      method: dataset-card
    access:
      method: zenodo
      uri: https://zenodo.org/records/11071202
      size_bytes: 1708000000
      notes: >
        Checked 2026-08-28 and re-confirmed 2026-08-30 by downloading the full
        archive once for verification: ReefSet_v1.0.zip (1.6GB, no smaller subset;
        the record's other files are SurfPerch_v1.0.zip, pretrained model weights,
        and an unrelated tutorial.zip — neither is the audio). The host does not
        honour Range requests on this file (returns full 200, not 206), so it stays
        all-or-nothing at 1.6GB even after the streaming-tar work below — this is a
        zip with no Range support, not a tar, so the new streaming reader does not
        apply, and `fetch_sample` correctly refuses it rather than pulling 1.6GB for
        a "bounded" sample. Fetch manually for a full corpus build.
    modalities: [audio]
    capabilities: [bioacoustics]
    items: 57084
    items_note: "~26 hours of labelled clips."
    annotations: [{ kind: audio-event, supervises: [taxon] }]
    coverage: { regions: [coral-triangle, gbr-australia] }
    domain_shift:
      caveats: ["Indo-Pacific reef soundscapes. Caribbean reef acoustics are under-sampled everywhere."]
    loader:
      layout: json-manifest-labels
      schema_id: sonotype
      params:
        manifest: "ReefSet_v1.0/reefset_annotations.json"
        media_dir: "ReefSet_v1.0/full_dataset"
        media: audio
      verified_on: 2026-08-30
      verified_note: >
        The declared audio-clips layout was wrong — clips are NOT pre-sorted into
        per-class directories. Confirmed by downloading and inspecting the full
        archive: 57,077 flat .wav files under full_dataset/, each named
        `<id>.<site>.<sharer>.<label>[_<sub>].wav` (e.g.
        `10002.mozambique.conservation_metrics.bioph_megnov.wav`), plus a
        reefset_annotations.json array of {id, file_name, label, data_sharer,
        dataset, recorder} — 57,074 records, matching file count within a handful.
        The label IS also embedded in the filename (confirmed against the JSON),
        but the manifest is the dataset's own documented source of truth, so the new
        json-manifest-labels loader reads that rather than re-deriving it from
        filename parsing.
    tags: [reef-audio, permissive]

  - id: mbari-pacific-sound
    name: MBARI Pacific Sound (MARS hydrophone)
    version: "live"
    description: Petabyte-scale continuous hydrophone archive from Monterey Bay.
    licence: CC-BY-4.0
    legal_basis: licence
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "AWS Open Data registry 'pacific-sound' — CC-BY 4.0"
      method: dataset-card
    access:
      method: s3
      uri: s3://pacific-sound
      notes: >
        Checked 2026-09-18: uri s3://pacific-sound does not exist (NoSuchBucket). Real
        buckets in us-west-2 (anonymous, no-sign-request) are pacific-sound-2khz
        (1,941,304,337,791 bytes / 3,745 files, measured 2026-09-18), pacific-sound-16khz
        (exists, not sized) and pacific-sound-256khz (unresolved, HTTP 301 — likely
        wrong-region endpoint). Open-ended continuous recording with no bounded mirror
        scope decided yet, so size_bytes stays deliberately unset here.
    modalities: [audio]
    capabilities: [bioacoustics, general-pretraining]
    items_note: "~2 TB/month, unlabelled."
    annotations: [{ kind: audio-event, supervises: [] }]
    coverage: { regions: [eastern-pacific, temperate] }
    domain_shift:
      caveats: ["Temperate, unlabelled. Self-supervised pretraining material rather than a reef benchmark."]
    loader: { layout: metadata-only }
    tags: [unlabelled, pretraining]

  - id: sanctsound
    name: NOAA SanctSound passive acoustic archive
    version: "2018-2021"
    description: Multi-site US sanctuary passive acoustic monitoring with daily species detections.
    licence: CC0-1.0
    legal_basis: licence
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "NOAA NCEI passive acoustic data products — US Government, CC0"
      method: site-terms
    access: { method: http, uri: https://www.ncei.noaa.gov/products/passive-acoustic-data }
    modalities: [audio]
    capabilities: [bioacoustics]
    items_note: "30 sites, several including reef habitat."
    annotations: [{ kind: audio-event, supervises: [taxon] }]
    coverage: { regions: [western-atlantic, central-pacific, temperate], years: [2018, 2021] }
    loader: { layout: metadata-only }
    tags: [public-domain, multi-site]

  - id: curacao-reef-soundscape
    name: Curaçao reef soundscape with 360° video
    version: "2025"
    description: >
      Spatially-resolved reef sound with paired 360° video linking fish sounds to source
      species — rare Caribbean acoustic data, and rare multimodal grounding.
    licence: CC0-1.0
    legal_basis: licence
    provenance: public
    verification:
      verified_on: 2026-08-29
      verified_by: >
        datadryad.org/dataset/doi:10.5061/dryad.mcvdnckcp — the dataset's own Dryad
        record — carries a `CC0` license field, and its page text states "FishEye
        Collaborative approves using these videos, including this watermark, under
        the CC0 license waiver."
      method: dataset-card
    access:
      method: http
      uri: https://datadryad.org/dataset/doi:10.5061/dryad.mcvdnckcp
      size_bytes: 3650000000  # documented upstream, not measured — 2026-09-18
    modalities: [audio, video]
    capabilities: [bioacoustics, fish-classification]
    items: 156
    items_note: "156 media items, 46 fish species, 3.65 GB."
    annotations: [{ kind: audio-event, classes: 46, supervises: [taxon] }]
    coverage: { regions: [caribbean], ecoregions: ["Southern Caribbean"] }
    notes: >
      Caribbean AND multimodal AND sound-to-species grounded. Small, but there is very
      little else like it — worth verifying the licence properly.
    loader: { layout: metadata-only }
    tags: [caribbean, multimodal, needs-verification]

  - id: watkins-marine-mammal
    name: Watkins Marine Mammal Sound Database
    version: "2016"
    description: The canonical marine-mammal reference sound library, 60+ species.
    licence: PROVENANCE-DEFECTIVE
    legal_basis: unknown
    provenance: public
    verification:
      verified_on: 2026-08-29
      verified_by: >
        cis.whoi.edu/science/B/whalesounds/about.cfm (via the Wayback Machine, the
        live site is down) — WHOI's own terms: "Sound files on this website are free
        to download for personal or academic (not commercial) use", crediting the
        Watkins Marine Mammal Sound Database, but "reposting this work on third party
        websites is not permitted." The registry's only working access path is
        archive.org item watkins_best_of_whales_202008 — a third-party repost by an
        individual (not WHOI). Its own description honestly credits WHOI and restates
        the personal/academic terms rather than claiming a different licence, which is
        better provenance hygiene than UIEB's silent mirror, but it is still exactly
        the repost WHOI's own page says is "not permitted": we cannot receive better
        title than the reposter had. Corrected from CC-BY-NC-4.0 to
        provenance-defective for AS CONFIGURED. If direct WHOI access is restored or
        obtained by other means, that channel would be RESEARCH-ONLY-NO-REDIST
        (personal/academic use, no further redistribution) — a Yohan call once a
        legitimate path exists, not a code change.
      method: site-terms
    access:
      method: http
      uri: https://cis.whoi.edu/science/B/whalesounds/
      size_bytes: 646056677
      params:
        sample_url: https://archive.org/download/watkins_best_of_whales_202008/watkins_best_of_whales.zip
      notes: >
        cis.whoi.edu is down (checked 2026-08-28; redirects to a WHOI maintenance
        page). sample_url is the Internet Archive "Best of" mirror (item
        watkins_best_of_whales_202008, 1,694 clips / 32 species) — a curated SUBSET of
        the full ~10,000-item corpus this entry describes, retained here only as a
        factual record of what this access path is; the licence gate now blocks it
        regardless of profile (see verified_note).
    modalities: [audio]
    capabilities: [bioacoustics, megafauna-id]
    items: 10000
    annotations: [{ kind: audio-event, classes: 60, supervises: [taxon] }]
    coverage: { regions: [global] }
    notes: >
      PROHIBITED — not for a defective licence GRANT (WHOI's own terms are clear:
      personal/academic non-commercial use with credit), but because the only working
      access path in this registry, an Internet Archive item, is a third-party repost
      that WHOI's own page says is "not permitted." We cannot receive better title
      than that repost had, however honestly it credits the source. If data is
      obtained directly from WHOI (site currently down) or by other authorized means,
      that channel would be RESEARCH-ONLY-NO-REDIST, not this — a call to make once a
      legitimate path exists, not a code change.
    loader:
      layout: audio-clips
      schema_id: worms-species
      params: { images_dir: watkins_best_of_whales }
      verified_on: 2026-08-28
      verified_note: >
        Live fetch confirms watkins_best_of_whales/<species>/sound/*.wav (found via
        rglob; a sibling metadata/*.csv per species is correctly ignored by suffix).
    tags: [reference-library, noncommercial]
