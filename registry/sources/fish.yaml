  - id: fathomnet
    name: FathomNet
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [deep_sea_benthic]
    version: "live"
    description: Large deep-sea annotation ecosystem with a mature API and taxonomy backbone.
    licence: PER-SOURCE-VARIES
    legal_basis: unknown
    redistribution: unknown
    provenance: public
    verification:
      verified_on: 2026-08-29
      verified_by: >
        fathomnet.org/terms (the database's own Terms of Use, not the catalog sweep
        this previously cited): "contributors can select from one of four Creative
        Commons licenses: CC0, CC-BY, CC-BY-NC, and CC-BY-NC-ND" per image submitted.
        Confirmed 2026-08-29 the `/api/images/list/all` response carries no per-image
        licence field at all — only `contributorsEmail` and imaging metadata — so
        there is no machine-readable way to select only the CC0/CC-BY subset. The
        previously-recorded CC-BY-4.0 was a blanket inference with no primary
        support and is corrected: some images in this exact API response are
        CC-BY-NC-ND, which a blanket CC-BY-4.0 claim would have let straight through
        the licence gate.
      method: site-terms
    access:
      method: api
      uri: https://database.fathomnet.org/api
      params: { client: fathomnet }
      notes: >
        fathomnet.org itself is now a Wix marketing site (redirects away from any API
        path, checked 2026-08-28). The real API — confirmed live and matching the
        official client, github.com/fathomnet/fathomnet-py — is database.fathomnet.org.
        No auth needed for reads.
    modalities: [image]
    capabilities: [fish-detection, megafauna-id, invertebrate-detection, general-pretraining]
    items: 100000
    annotations: [{ kind: bbox, count: 6600000, supervises: [taxon] }]
    coverage: { regions: [deep-sea, eastern-pacific] }
    domain_shift:
      caveats: ["Excellent infrastructure, weak reef overlap."]
    notes: >
      Legal-basis re-check 2026-09-18: fathomnet.org/terms (JS-rendered Wix page, HTTP
      200) could not be quoted cleanly via anonymous curl, but verification.verified_by
      above already confirms the same four-licence (CC0/CC-BY/CC-BY-NC/CC-BY-NC-ND)
      per-image split with no machine-readable per-image field. legal_basis stays
      `unknown`; resolving needs a per-image licence lookup or written permission
      covering the NC/ND-tagged images before shipping use.
    loader:
      layout: coco-json
      schema_id: worms-species
      verified_on: 2026-08-28
      verified_note: >
        Live fetch of 100 images via GET /api/images/list/all confirms bounding-box
        concept labels (e.g. "feather star") and a working images/ + annotations.json.
    tags: [deep-sea, api]

