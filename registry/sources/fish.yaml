# Fish and mobile fauna.
#
# Most entries here are `method: secondary` — transcribed from our internal catalog's
# 2026-07 web-verified sweep rather than re-checked at source. They are usable on the
# research profile and blocked from shipping profiles until someone opens the primary
# source. That backlog is deliberate and visible rather than assumed away.

sources:
  - id: ozfish
    name: OzFish
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [coral_reef]
    version: "2020"
    description: >
      Stereo-BRUV reef fish dataset with bounding boxes and millimetre length
      measurements — the most relevant public asset for length-based biomass.
    licence: CC-BY-3.0-AU
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-29
      verified_by: >
        raw.githubusercontent.com/open-AIMS/ozfish/master/README.md — "This work is
        licensed under a [Creative Commons Attribution 3.0 Australian License]", link
        target creativecommons.org/licenses/by/3.0/au/. Corrected from CC-BY-4.0: the
        repo's own badge alt-text misleadingly reads "CC BY 4.0" while the badge image
        and the link both say 3.0 AU — the likely source of the original mis-entry.
        Same practical permissions either way (attribution only).
      method: licence-file
    access:
      method: http
      uri: https://storage.pawsey.org.au/public/m/FDFML/
      notes: >
        D-R5 (2026-09-25 charter): the Pawsey URLs are live — corrected from
        "request" (stale per the 2026-09-25 catalog sweep, see the ozfish ingest
        spec's why_not_supported). storage.pawsey.org.au/public/m/FDFML/{frames,
        crops,labelled} are open, anonymous-GET, HTTP-206-verified prefixes (a
        Pawsey/Nectar Swift object-storage container, not a plain S3 API — the
        bucket adapter's path-style listing 404s and a plain HTML GET returns the
        portal's JS-shell front end, not a file list). marinedata has no adapter
        for the Swift container-listing convention yet (registry/ingest-specs/
        ozfish.yaml: needs:pawsey, WP-6d) — per-file URLs need a portal-specific
        listing (Swift `?format=json`) once built.
    modalities: [image]
    capabilities: [fish-detection, fish-classification, fish-biomass]
    items: 80000
    items_note: "~80k cropped detections across ~70 families."
    annotations:
      - kind: bbox
        supervises: [taxon, size]
        notes: "Stereo pairs with mm-accurate length — the supervision monocular sets cannot provide."
    coverage:
      regions: [gbr-australia]
    domain_shift:
      trained_regions: [gbr-australia]
      caveats:
        - "Australian species assemblage. Caribbean fish ID will need its own labels."
        - "Length→weight conversion requires per-species a,b coefficients (FishBase); the dataset does not supply them."
    loader: { layout: coco-json, params: { annotations: annotations.json, images_dir: images }, schema_id: worms-species }
    citation: "Australian Institute of Marine Science (AIMS), University of Western Australia (UWA) and Curtin University. (2019), OzFish Dataset - Machine learning dataset for Baited Remote Underwater Video Stations, https://doi.org/10.25845/5e28f062c5097"
    tags: [stereo, biomass, length]

  - id: deepfish
    name: DeepFish
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [mixed]
    version: "2020"
    description: Habitat-diverse fish imagery from turbid Australian waters, with segmentation and counts.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-29
      verified_by: >
        researchdata.jcu.edu.au/published/48fcdde6576ee929325b01fca4207914 (JCU's own
        institutional research-data repository, DOI 10.25903/5f617fb6d6e0e — the
        canonical host cited by both the GitHub repo and the Scientific Reports paper)
        states "CC BY 4.0: Attribution 4.0 International". Note for future reviewers:
        the GitHub repo's own LICENSE file is MIT — that covers the repo's *code*, not
        the imagery/annotations, which live at JCU under CC-BY-4.0 as recorded here.
      method: dataset-card
    access:
      method: http
      uri: https://alzayats.github.io/DeepFish/
      size_bytes: 7621627392
      params:
        sample_url: "http://data.qld.edu.au/public/Q5842/2020-AlzayatSaleh-00e364223a600e83bd9c3f5bcd91045-DeepFish/DeepFish.tar"
        tar_start_offset: 7516966912
      notes: >
        Checked 2026-08-28: only one archive exists (QLD data repository,
        DeepFish.tar, 7.1GB, Range-capable but nowhere near a "sample" size — at
        the time, this project had no way to read a remote tar without downloading
        it whole, so Range support didn't help). Fixed 2026-08-30 with a streaming
        remote-tar reader (see fetch._extract_remote_tar): tar has no central
        directory, so it reads forward from the start one member at a time and
        stops as soon as `limit` files are extracted, at whatever byte offset that
        happens to land — no full download needed regardless of archive size.
        The tar bundles three task variants (Classification/, Localization/,
        Segmentation/ — in that order), and this source's real annotation target,
        Segmentation/, sits in the last ~1.4% of the file: reading sequentially
        from byte 0 would mean tens of thousands of header round trips just to
        skip Classification+Localization. tar_start_offset (new) was located by
        binary-searching the remote file for a real tar header (~5 large Range
        reads, not a sequential scan) and pins the byte where
        DeepFish/Segmentation/ itself begins.

        A real limitation, found the hard way: within Segmentation/, ALL of
        images/{empty,valid}/ comes before ALL of masks/{empty,valid}/ — the two
        are two separate multi-hundred-file regions, not interleaved per site — so
        a small bounded `--limit` (its default 100, or 150) reads only images and
        never reaches a mask, and `image-mask-pairs` correctly refuses that as an
        empty result rather than reporting false success. This is the licence-gate
        design principle "empty results are errors, not success" applying exactly
        as intended, not a bug in tar_start_offset or the loader. A full or
        near-full build from this source (`limit` unset or in the low thousands)
        does produce real pairs — see the loader's own verified_note.
    modalities: [image]
    capabilities: [fish-detection, general-pretraining]
    items: 40000
    annotations:
      - kind: dense-mask
        supervises: []
        notes: "Segmentation and counts only — no species or length labels."
    coverage: { regions: [gbr-australia] }
    domain_shift:
      caveats: ["Turbid-water imagery — valuable precisely because most sets are clear-water."]
    loader:
      layout: image-mask-pairs
      params:
        images_dir: "DeepFish/Segmentation/images"
        masks_dir: "DeepFish/Segmentation/masks"
      verified_on: 2026-08-30
      verified_note: >
        Confirmed by locating the real Segmentation/ byte range (see
        tar_start_offset above) and manually extracting from two points within it —
        the start of images/ and, separately, deep into masks/ — that stems
        genuinely match across the two regions:
        DeepFish/Segmentation/images/empty/7117_no_fish_2_f000000.jpg and
        DeepFish/Segmentation/masks/empty/7117_no_fish_2_f000000.png are the same
        item, confirmed as one of 58 matching stems found this way. images/ and
        masks/ are two separate multi-hundred-file regions within Segmentation/,
        not interleaved per site, so `marinedata verify deepfish` with a small
        `--limit` correctly reports no matched items (it never reaches masks/) —
        see access.notes for why that is expected, not a defect. The
        Classification/ and Localization/ folders earlier in the tar are different
        annotation types (image-level labels and point/bbox detections
        respectively) and are not what this entry's declared dense-mask annotation
        describes.
    citation: "Saleh, A., Laradji, I. H., Konovalov, D. A., Bradley, M., Vazquez, D., & Sheaves, M. (2020). A realistic fish-habitat dataset to evaluate algorithms for underwater visual analysis. Scientific Reports, 10(1). https://doi.org/10.1038/s41598-020-71639-x"
    tags: [turbid, weak-labels]

