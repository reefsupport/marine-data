  - id: mft25
    name: MFT25 (Multiple Fish Tracking 2025)
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [mixed]
    version: "2025"
    description: >
      The first proper underwater fish multi-object-tracking benchmark, released with
      the SU-T tracker (AAAI 2026 Oral).
    licence: Apache-2.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-29
      verified_by: >
        huggingface.co/datasets/Vranlee/MFT25 dataset card YAML declares
        `license: apache-2.0`. Flagged disputed rather than accepted outright: Apache
        2.0 is a software licence, an unusual and likely-mistaken choice for a
        video/annotation dataset (HF's license picklist has no better-fitting option,
        and uploaders often default to it) — arXiv 2507.06400 and
        github.com/vranlee/SU-T state no licence at all for the data. A primary source
        does say Apache-2.0; another primary channel (the paper/code repo) is silent,
        which is not the same as contradicting it, but is not confirmation either.
      method: dataset-card
      disputed: true
      dispute_note: >
        HF dataset card declares apache-2.0; the paper and code repo carry no
        licence statement for the data at all. Apache-2.0 is written for software,
        not imagery/annotations — plausibly a placeholder default rather than a
        considered choice. Confirm with the authors before shipping on this basis.
    access: { method: request, uri: https://vranlee.github.io/SU-T/ }
    modalities: [video]
    capabilities: [fish-tracking, fish-detection]
    items: 48066
    items_note: "15 sequences, 48,066 frames, 408,578 boxes."
    annotations: [{ kind: track, count: 408578, supervises: [taxon] }]
    coverage: { regions: [unknown] }
    domain_shift:
      caveats: ["SOTA on this benchmark is 34.1 HOTA — underwater MOT is far from solved. Do not plan a product on tracking-based abundance."]
    loader: { layout: metadata-only }
    tags: [tracking, benchmark]

