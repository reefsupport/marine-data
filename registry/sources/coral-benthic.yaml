      stripping the trailing `_<patchid>` crop suffix) yields 2,328 groups, of which
      1,146 already straddle more than one of the upstream train/val/test splits —
      upstream's own split leaks at the parent-image level, so it is never honoured
      (matches the v3i/v6i finding). The rule above groups by the coarser *site* token
      instead (236 groups, max 923 images in one site, `LaehouShallow`), the leak-safe
      choice named in the brief.
    tags: [bleaching, public-domain]

