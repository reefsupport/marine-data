  - id: coralnet
    name: CoralNet
    version: "live"
    description: >
      The incumbent platform for point-count benthic classification: ~1.6M images and
      16.5M point annotations across ~330 sources.
    licence: NO-LICENCE-STATED
    legal_basis: tdm
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: >
        coralnet.ucsd.edu /about/ and /source/about/ read on 2026-08-17: the platform is
        described as open source and free, sources may be public or private, and NO
        licence, ownership or commercial-use terms are stated for imagery or annotations.
        coralnet.ucsd.edu/robots.txt returned HTTP 404 — no site-level machine-readable
        crawl reservation exists as of that date.
      method: absent
    access:
      method: scrape
      uri: https://coralnet.ucsd.edu/
      notes: "No batch download. Per-source retrieval only; see CoralNet-Toolbox."
    modalities: [image]
    capabilities: [benthic-classification, general-pretraining, coral-taxonomy]
    items: 1600000
    annotations:
      - kind: point-label
        count: 16500000
        schema_id: coralnet-labelset
        classes: 1275
        supervises: [taxon]
        depth: L3
        notes: "1,275 labels deduplicated from 4,489 user labels — taxonomy harmonisation is a real problem."
    coverage:
      regions: [global, caribbean, central-pacific]
    domain_shift:
      caveats:
        - "Per-source accuracy varies widely; label soup across sources."
    notes: >
      NOT non-commercial — UNLICENSED, which is legally worse: public visibility is not a
      grant. Any use rests on the EU TDM exception (Art. 15o Auteurswet). The absent
      robots.txt is favourable but is not permission, and per-source terms may still
      exist. Requires counsel sign-off before use; the pretrain-eu profile enforces this.
      The CoralNet *labelset structure* is factual and usable regardless — see
      docs/LEGAL.md on facts vs expression.
    loader:
      layout: csv-points
      schema_id: coralnet-labelset
    tags: [tdm, unlicensed, incumbent]

