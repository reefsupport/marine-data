# Public coral and benthic datasets.

sources:
  - id: coralscapes
    name: Coralscapes
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [coral_reef]
    version: "1.0"
    description: >
      The first general-purpose dense semantic segmentation dataset for coral reefs —
      "the Cityscapes of coral". 39 benthic classes, expert polygon annotations, Red Sea.
      Pretrained SegFormer and DINOv2/DPT checkpoints are published alongside.
    licence: Apache-2.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    checksums:
      version: "1.0"
      root_digest: da0ed5b386664e73176cbde0654771509f5f208f22d63c26d2d1d42963826a3e
      files: 4154
      size_bytes: 5848379518
    verification:
      verified_on: 2026-08-18
      verified_by: >
        RESOLVED against both distribution points directly. Zenodo REST API record
        15061505 returns metadata.license = {"id": "apache2.0"}; the HuggingFace API for
        EPFL-ECEO/coralscapes returns cardData.license = "apache-2.0" and the tag
        "license:apache-2.0". The earlier CC-BY-SA-4.0 reading came from the ICCV paper
        text, which is not where the data is licensed.
      method: dataset-card
    access:
      method: s3
      uri: s3://rs-storage-open/sources/coralscapes/1.0/
      size_bytes: 5848379518  # verified S61 2026-09-25, size+md5==ETag every object
      notes: >
        S61 (2026-09-25): re-pointed from the upstream HuggingFace dataset
        (EPFL-ECEO/coralscapes) to our own durable copy on rs-storage-open, verified
        object-by-object (size + md5 == ETag) against the local staged tree this pin
        was taken from. S62 (2026-09-25, D-O): `loader.layout` flipped to `staged-tree`
        — the staged tree already has `metadata.parquet` + `labels/masks/` in exactly
        the shape `StagedTreeLoader` expects, so this is `_is_pinned_staged_tree`-true
        now: a live `fetch`/`verify` reads `CHECKSUMS.sha256` by its known key rather
        than listing the prefix, and no longer needs the anonymous `ListBucket` that
        rs-storage-open denies (S7i). Anonymous `GetObject` on a known key works.
      params:
        bucket: rs-storage-open
        endpoint: hel1.your-objectstorage.com
        region: hel1
        prefix: sources/coralscapes/1.0/
        hf_id: EPFL-ECEO/coralscapes
        config: default
        split: train
        image_column: image
        mask_column: label
    modalities: [image]
    capabilities:
      - benthic-segmentation
      - coral-taxonomy
      - bleaching-assessment
      - general-pretraining
    loader:
      layout: staged-tree
      schema_id: coralscapes-39
      crosswalk_id: coralscapes-39
      verified_on: 2026-09-18
      verified_note: >
        Real ingest of all 13 upstream shards (9 train + 3 test + 1 validation)
        confirms 2075 image/mask pairs (train 1517, test 392, validation 166),
        exact stem match, no unlabelled or unpaired files. Images are 8-bit PNG
        (2075/2075); masks are palette-indexed PNG (mode P, 2075/2075), observed
        indices 0-39, matching ANNOTATIONS.json's declared 40-class
        observed_indices range. Corrected 2026-09-18 (brief D2c): raster_ignore_value
        is index 0 (the upstream unlabelled/ignore value, matching upstream model
        config semantic_loss_ignore_index: 0) — 255 never occurs in the archive at
        all. Index 0 alone covers ~17.1% of all mask pixels; a consumer that trusted
        the prior (wrong) note trained on "unlabelled" as class 255-that-never-occurs
        and left index 0 uncovered as a real class.
    items: 2075
    annotations:
      - kind: dense-mask
        count: 174000
        schema_id: coralscapes-39
        classes: 39
        supervises: [taxon, form, condition]
        depth: L3
        notes: >
          The 39 classes are a flattened, incomplete cross-product of
          taxon × growth-form × condition (e.g. "massive/meandering bleached").
          Decompose via crosswalks/coralscapes-39.yaml rather than treating as flat.
    coverage:
      regions: [red-sea]
      ecoregions: ["Northern and Central Red Sea", "Southern Red Sea"]
      sites: 5
    domain_shift:
      trained_regions: [red-sea]
      missing_classes:
        - "soft coral"
        - "gorgonian / sea fan"
        - "sea rod"
        - "sea plume"
        - "octocoral (any)"
      known_drops:
        - to_region: caribbean
          metric: "live-coral cover fidelity"
          delta: -30.0
          source: >
            Reef Support production runs 2026-08 — six rs-ai runs across three
            segmentation backbones collapsed to ~50% "unknown hard substrate" and
            ~32% "rubble" on non-Red-Sea footage, invariant to model capacity.
      caveats:
        - "CRITICAL: the schema contains no soft-coral class of any kind. On octocoral-dominated Caribbean reefs the model has no valid label and collapses into 'unknown hard substrate' and 'rubble'. Do not deploy on Caribbean imagery without re-heading to a schema that includes octocorals."
        - "Several classes are Indo-Pacific/Red-Sea endemics absent from the Atlantic: table acropora, stylophora, turbinaria, pocillopora, crown-of-thorns."
        - "Only 2,075 images — small for dense segmentation. Best used as a transfer base, not a sole training set."
    split_group:
      pattern: '(?i)(site[0-9]+)'
      match_field: stem
      template: "coralscapes/{group}"
    citation: "Sauder et al., The Coralscapes Dataset, ICCV 2025 Marine Vision Workshop"
    homepage: https://josauder.github.io/coralscapes/
    tags: [dense-seg, transfer-base, red-sea]

  - id: benthicnet-1m
    name: BenthicNet (curated 1M subset)
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [mixed]
    version: "1.0"
    description: >
      The largest and most geographically diverse compilation of seafloor imagery.
      11.4M images collected, 1.3M spatially deduplicated, 188,688 labelled with 2.6M
      annotations translated to the CATAMI hierarchical scheme. Self-supervised
      pretraining on this substantially outperforms ImageNet on small regional sets.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "arXiv 2405.05241 / Scientific Data 2025 — CC-BY-4.0 for metadata and models; most images CC-BY with per-source exceptions noted in Appendix C"
      method: dataset-card
    access:
      method: request
      uri: https://doi.org/10.20383/103.0614
      notes: >
        Checked 2026-08-28: the DOI resolves to a Federated Research Data Repository
        (FRDR) record whose only file-transfer path is Globus Connect (an OAuth login
        button gates the file listing itself — /repo/userfiles 400s without an
        authenticated Globus session). No anonymous single-GET path exists, at any
        size. A HuggingFace mirror (ndotm/benthicnet_labelled) exists but is a 1.09GB
        label CSV with zero images, so it cannot satisfy the images/+csv layout
        either. Needs a human with a Globus account to fetch a sample manually.
    modalities: [image]
    capabilities:
      - benthic-classification
      - general-pretraining
      - coral-taxonomy
    items: 1300000
    items_note: "11.4M raw; 1.3M deduplicated; 188,688 labelled."
    annotations:
      - kind: point-label
        count: 2600000
        schema_id: catami-1.4
        supervises: [taxon]
        depth: L3
        notes: "Hierarchical CATAMI, ragged depth by source. Biota maps to WoRMS AphiaIDs."
    coverage:
      regions: [global, temperate, deep-sea, gbr-australia, western-atlantic]
      depth_range_m: [0.0, 5500.0]
      years: [1965, 2021]
    domain_shift:
      trained_regions: [global]
      caveats:
        - "Benthic-general, not coral-specific — much of it is temperate and soft-sediment seafloor. Tropical reef is a minority."
        - "Per-source licence exceptions exist (Appendix C). Verify any subset before shipping use."
        - "Annotations are sparse points, not masks."
    citation: "Lowe, Misiuk et al., BenthicNet, Scientific Data 2025"
    loader:
      layout: csv-points
      schema_id: catami-1.4
      crosswalk_id: catami-1.4
    tags: [pretraining, catami, largest]

  - id: reefnet
    name: ReefNet
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [coral_reef]
    version: "2025"
    description: >
      Fine-grained hard-coral genus benchmark aggregating 76 CoralNet sources plus new
      Red Sea (Al-Wajh) imagery, standardised to WoRMS taxonomy. The most honest
      cross-source generalisation testbed available.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "arXiv 2510.16822 v3 states CC BY 4.0"
      method: dataset-card
    access:
      method: request
      uri: https://arxiv.org/abs/2510.16822
      notes: "Code and data stated as released 'upon acceptance' — confirm availability."
    notes: >
      D-R1 (2026-09-25 charter): superseded_by reefnet-hf. This stub has no resolvable
      download_urls (arXiv/GitHub only, "upon acceptance"); the same dataset (arXiv
      2510.16822) is live and ingestible via the reefnet-hf Source. Kept as an alias
      only — access.method stays "request" so it is never picked up by an ingest
      drain; never ingest this entry directly, never delete it.
    modalities: [image]
    capabilities: [coral-taxonomy, benthic-classification, general-pretraining]
    items: 181223
    items_note: "334,162 images total; 181,223 carry hard-coral annotations."
    annotations:
      - kind: point-label
        count: 925000
        schema_id: worms-genus
        classes: 39
        supervises: [taxon]
        depth: L3
        notes: "38 genera + Fungiidae. ~479k high-confidence at 92% expert agreement."
    coverage:
      regions: [global, central-pacific, red-sea, gbr-australia]
      ecoregions: ["Hawaii", "Samoa", "Mariana", "Al-Wajh"]
    domain_shift:
      trained_regions: [central-pacific, red-sea]
      known_drops:
        - to_region: caribbean
          metric: "macro recall (cross-source)"
          delta: -28.0
          source: "arXiv 2510.16822 — within-source 84% vs cross-source ~56% (MAE-ViT)"
      caveats:
        - "Severe Indo-Pacific bias: Hawaii 221k, Samoa 202k, Mariana 108k, but Caribbean and Brazil under 8k each."
        - "Zero-shot BioCLIP2 reaches only 23.5% macro recall — foundation models are far from genus-level coral ID."
        - "Point labels, not masks."
    citation: "Felemban, Battach, Khan et al., ReefNet, KAUST + MIT, arXiv 2510.16822"
    loader:
      layout: csv-points
      schema_id: worms-genus
      crosswalk_id: worms-genus
      verified_note: >
        Wired to the existing worms-genus → rs-benthic-v1 identity crosswalk (exact
        AphiaID matches), which already anchors 12 of ReefNet's genera (Acropora,
        Porites, Pocillopora, Stylophora, Turbinaria, Millepora, plus the 9 Caribbean
        genera). NOT extended to ReefNet's other ~27 genera: the paper (arXiv
        2510.16822) states 39 hard-coral classes but does not list them by name in
        the abstract, and code/data are "released upon acceptance" — not yet public,
        so there is no primary source to check candidate genus names or AphiaIDs
        against. Adding nodes from a guessed genus list is exactly the mistake this
        project's own history warns about (3 of the first 8 hand-entered AphiaIDs
        were wrong). Unmapped genera correctly abstain via the existing crosswalk
        machinery rather than being forced onto a coarser or unrelated node — revisit
        once the actual label list is public.
    tags: [genus, benchmark, domain-shift-testbed]

  - id: deolhonoscorais
    name: "#DeOlhoNosCorais"
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [coral_reef]
    version: "2023"
    description: >
      Polygon-annotated Brazilian reef imagery from a citizen-science programme. One of
      very few Atlantic dense-annotation sets, and therefore disproportionately relevant
      to Caribbean work despite its modest size.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "PeerJ 16219 / Zenodo 10.5281/zenodo.7338208 — CC-BY"
      method: dataset-card
    access:
      method: zenodo
      uri: https://doi.org/10.5281/zenodo.7338208
      size_bytes: 2985845243
      params:
        sample_url: https://zenodo.org/records/7338208/files/full_dataset.zip
        nested_archive: segmentation_map.zip
      notes: >
        The Zenodo record has exactly two files, full_dataset.zip (5.15GB) and
        experiments.zip (7.7GB) — no smaller subset. full_dataset.zip is a zip-of-zips
        (classification.zip 2.16GB + segmentation_map.zip 2.99GB, both stored
        uncompressed), and the real per-image annotations live inside
        segmentation_map.zip. Zenodo honours HTTP Range on GET but never advertises
        Accept-Ranges on HEAD or GET (checked 2026-08-28) — nested_archive reads
        segmentation_map.zip by windowing into the outer file's Range-addressable
        bytes, so neither the 5.15GB outer zip nor the 2.99GB inner one is ever
        downloaded in full just to pull a verification sample.
    modalities: [image]
    capabilities:
      - benthic-segmentation
      - coral-instance-segmentation
      - coral-taxonomy
    items: 1411
    annotations:
      - kind: dense-mask
        schema_id: deolho-21
        classes: 21
        supervises: [taxon]
        depth: L3
        notes: "LabelMe polygons; supports semantic seg, instance seg and detection."
    coverage:
      regions: [western-atlantic]
      years: [2014, 2021]
    domain_shift:
      trained_regions: [western-atlantic]
      caveats:
        - "Brazilian Atlantic fauna overlaps Caribbean only partially, but far more than any Indo-Pacific set."
        - "Small (1,411 images) — a fine-tuning and validation asset, not a training corpus."
    citation: "Soares et al., PeerJ 2023"
    loader:
      layout: labelme-json
      schema_id: worms-species
      params: { partition_glob: "*" }
      verified_on: 2026-08-28
      verified_note: >
        The declared image-mask-pairs layout was wrong — there are no mask PNGs at
        all. Live-read (via nested_archive, see access.notes) confirms
        train/test/val/<stem>.jpg + <stem>.json sidecars, LabelMe polygon format,
        with real Brazilian scleractinian species names as labels (e.g. "Mussismilia
        hispida", "Siderastrea stellata", "Agaricia spp") — not the
        annotations.schema_id: deolho-21 this entry also declares. Corrected
        2026-08-29: loader.schema_id was `dataset-native` (implying a hand-authored
        crosswalk is the missing piece); the real labels are open-vocabulary
        genus/species binomials, exactly what worms-species exists for, needing no
        static crosswalk_id at all. `deolho-21` is registered in
        `registry/schemas/open-vocabs.yaml` as a closed, unenumerated stub (the
        dataset's native 21-class polygon vocabulary) purely so
        annotations[].schema_id resolves at load; the loader never uses it, since the
        real per-image labels are worms-species binomials, not the polygon classes.
    tags: [atlantic, dense-seg, rare-region]

  - id: heron-reef-benthic
    name: Heron Reef benthic community time series
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [coral_reef]
    version: "2021"
    description: 17-year georeferenced photoquadrat time series from the Great Barrier Reef.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "Nature Scientific Data s41597-021-00871-5 — CC-BY 4.0, metadata CC0"
      method: dataset-card
    access:
      method: http
      uri: https://www.nature.com/articles/s41597-021-00871-5
      params:
        sample_url: https://doi.pangaea.de/10.1594/PANGAEA.894801?format=zip
        fetch_style: manifest
      notes: >
        The paper's data lives on PANGAEA as a 32-file "tab" collection
        (?format=zip, ~2.8MB). It does NOT contain image bytes — each
        *_links-to-photos.tab carries a "URL thumb" column of individually-
        addressable HTTPS image URLs (hs.pangaea.de/Images/Benthos/Heron_Reef/
        <year>/<file>.jpg, live-verified) — fetch_style: manifest downloads the
        manifest, then GETs the referenced thumbnails up to the sample limit.
    modalities: [image]
    capabilities: [benthic-classification, general-pretraining]
    items: 58941
    annotations:
      - kind: tabular
        count: 108700
        supervises: []
        notes: >
          A SEPARATE *_benthic_substrate_cover_<year>.tab per year carries the real
          annotation: percent cover across 62 named categories (AIMS/GBR LTMP-style
          codes, e.g. ACR_BRA, not CATAMI or CoralNet) for EACH photoquadrat, joined
          to the photo by "File name" — one row per image, not one row per point,
          despite this entry's original "point-label"/coralnet-labelset declaration
          (never checked against real data; corrected 2026-08-28). Fetching and
          joining this second table, and deciding how a 62-way percent-cover vector
          becomes a Sample-level label (a dominant class? kept as a soft
          distribution?), is real further work — left undone here rather than
          guessed. supervises is honestly empty until that decision is made.
    coverage:
      regions: [gbr-australia]
      years: [2002, 2018]
    domain_shift:
      trained_regions: [gbr-australia]
      caveats:
        - "Only 6 classes — coarse. Valuable for temporal-change work rather than fine taxonomy."
    loader:
      layout: flat-images
      schema_id: dataset-native
      verified_on: 2026-08-28
      verified_note: >
        Live fetch confirms the manifest → thumbnail-URL → images/ path works.
        flat-images because no per-image label is extracted yet (see
        annotations[].notes) — general-pretraining value only, for now.
    citation: "Roelfsema, C., Kovacs, E. M., Markey, K., Vercelloni, J., Rodriguez-Ramirez, A., Lopez-Marcano, S., Gonzalez-Rivero, M., Hoegh-Guldberg, O., & Phinn, S. R. (2021). Benthic and coral reef community field data for Heron Reef, Southern Great Barrier Reef, Australia, 2002-2018. Scientific Data, 8(1). https://doi.org/10.1038/s41597-021-00871-5"
    tags: [time-series, gbr]

  - id: coralvqa
    name: CoralVQA
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [coral_reef]
    version: "2025"
    description: Large-scale visual question answering dataset for coral reef understanding.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "HuggingFace card CoralReefData/CoralVQA states license:cc-by-4.0"
      method: dataset-card
    access:
      method: huggingface
      uri: https://huggingface.co/datasets/CoralReefData/CoralVQA
      size_bytes: 26694403050
      params:
        sample_url: https://huggingface.co/datasets/CoralReefData/CoralVQA/resolve/main/CoralVQA_Image.zip
      notes: >
        Re-checked 2026-08-28: the datasets-server rows API no longer errors, but the
        default parquet's `image` column is null for every row — the repo's auto-built
        table never actually embedded images. The real 12,805 images live only in
        CoralVQA_Image.zip, a single 26.7GB archive with no smaller subset (the
