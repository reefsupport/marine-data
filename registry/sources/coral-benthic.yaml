  - id: mermaid-aws
    name: MERMAID community coral reef image classification training data
    version: "live"
    description: >
      Live, growing point-label corpus with a taxonomy crosswalk API (LabelMapping)
      that harmonises partner label schemes.
    licence: CC-BY-NC-SA-4.0
    legal_basis: licence
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "registry.opendata.aws/coralreef-image-classification-training — CC BY-NC-SA 4.0"
      method: dataset-card
    access:
      method: s3
      uri: s3://coral-reef-training
      notes: "no-sign-request - anonymously listable, no credentials needed"
      params:
        bucket: coral-reef-training
        endpoint: s3.amazonaws.com
        region: us-east-1
        prefix: mermaid/
    modalities: [image, tabular]
    capabilities: [benthic-classification, coral-taxonomy]
    annotations:
      - kind: point-label
        schema_id: mermaid-attributes
        supervises: [taxon, form]
    coverage:
      regions: [global]
    loader:
      layout: flat-images
      verified_on: 2026-08-17
      verified_note: >
        Prefix mapped and listing verified anonymously. An earlier note said the prefix
        was unidentified - it is `mermaid/`, flat, UUID-keyed. flat-images reads the
        full-resolution PNGs; the per-image `_annotations.csv` files and precomputed
        `_featurevector` blobs are NOT yet exposed by any layout and would need a
        paired-sidecar reader.
      schema_id: coralnet-labelset
      crosswalk_id: coralnet-labelset
    notes: >
      NOT CoralNet data. Verified 2026-08-17 by listing the bucket: it contains exactly
      one top-level prefix, `mermaid/`, and no CoralNet prefix. CoralNet is a named
      partner with write access to its own prefix but has not used it, so this corpus is
      MERMAID's own confirmed annotations.

      The related-but-separate fact: MERMAID AI's *classifier* is trained on ~16M public
      CoralNet images and runs CoralNet's pyspacer engine. The model is CoralNet-derived;
      this dataset is not. Do not treat one as evidence about the other.

      Structure is flat under `mermaid/`, keyed by UUID, with four artefacts per image:
      `<uuid>.png` (~1-2 MB), `_thumbnail.png`, `_annotations.csv` (present on a subset),
      and `_featurevector` (~140 KB of PRECOMPUTED pyspacer features). Those feature
      vectors are unusual and valuable: a linear probe can be trained on them with no GPU
      and no image decoding at all.

      NC-SA still blocks commercial training. The LabelMapping *crosswalk* — the fact that
      attribute X corresponds to CATAMI Y — is factual information, not copyrightable
      expression, and can inform our ontology without using the imagery.
    tags: [crosswalk, noncommercial]

  - id: marineinst20m
    name: MarineInst20M
    version: "2024"
    description: >
      2.42M marine images with 19.2M instance masks, aggregated from ~50 sources —
      the largest marine instance-segmentation corpus in existence.
    licence: PROVENANCE-DEFECTIVE
    legal_basis: unknown
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "external/ai/MarineInst/LICENSE.txt — CC BY-NC-SA 4.0, HKUST VGD; source list in the ECCV 2024 supplementary names Flickr, Shutterstock, Getty Images, YouTube and 'private web images'"
      method: licence-file
    access:
      method: http
      uri: https://github.com/zhengziqiang/MarineInst20M
    modalities: [image]
    capabilities: [coral-instance-segmentation, general-pretraining]
    items: 2420000
    annotations:
      - kind: instance-mask
        count: 19200000
        supervises: []
    coverage:
      regions: [global]
    notes: >
      PROHIBITED — not because of the CC-BY-NC-SA licence, but because HKUST cannot grant
      a CC licence over Getty and Shutterstock imagery it scraped. The declared licence
      exceeds the rights held, so the grant is void as to those works, and the stock
      agencies maintain explicit machine-readable anti-scraping terms that would defeat
      the TDM exception besides. No route reaches this dataset: not a licence, not
      permission from HKUST, not open-sourcing the derivative, not a research entity.
      Our own earlier catalog recorded this as "Mixed / Open" — that error is exactly
      why verification requires a primary source.
    loader: { layout: metadata-only }
    tags: [prohibited, provenance-risk]
