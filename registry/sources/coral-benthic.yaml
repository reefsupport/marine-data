    items: 9682
    annotations:
      - kind: image-label
        supervises: []
        notes: "VQA pairs. Evidence suggests VLMs are unreliable for quantitative reef assessment — treat as a language/UX asset, not a measurement one."
    coverage:
      regions: [global]
    citation: "arXiv 2507.10449"
    split_group:
      pattern: '^(.{5})'
      match_field: stem
      template: "seaview/{group}"
    loader:
      layout: flat-images
      verified_on: 2026-08-28
      verified_note: >
        Live fetch of CoralVQA_Image.zip (via Range) shows a flat pool of numbered
        .jpg files at the archive root — no class subdirectories. The previously
        declared 'image-folder' layout would have raised "found none" on any real
        attempt to load this source; it had never actually been checked.
    tags: [vqa, language]

