# Reef Support's own and partner data.
#
# Counts are from a live rclone scan of the Hetzner buckets on 2026-08-17 and a full
# parse of every Labelbox export-result.ndjson — not from prior documentation.

sources:
  - id: reef-support-benthic-own
    name: Reef Support benthic instance masks — own imagery (Colombia)
    version: "2026-08"
    description: >
      Expert Labelbox instance masks over four Colombian sites where BOTH the imagery and
      the annotations are ours: Tayrona (658), Seaflower Bolivar (246), Seaflower Courtown
      (241), Tetes Providencia (105).
    licence: PROPRIETARY-OWN
    legal_basis: own
    provenance: own
    verification:
      verified_on: 2026-08-17
      verified_by: "Live rclone scan of s3://rs-storage-open/benthic_datasets/mask_labels/reef_support; per-site image counts parsed from the object manifest"
      method: licence-file
    access:
      method: s3
      uri: s3://rs-storage-open/benthic_datasets/mask_labels/reef_support
      params:
        bucket: rs-storage-open
        endpoint: hel1.your-objectstorage.com
        region: hel1
        prefix: benthic_datasets/mask_labels/reef_support/SEAFLOWER_BOLIVAR/
        credentials_env: S3
    modalities: [image]
    capabilities:
      - benthic-segmentation
      - coral-instance-segmentation
      - general-pretraining
    loader:
      layout: labelbox-ndjson
      schema_id: reef-support-labelbox
      crosswalk_id: reef-support-labelbox
      verified_on: 2026-08-17
      verified_note: >
        Verified against the live Hetzner bucket. Site-partitioned - each site directory
        holds images/ + masks/ + masks_stitched/ + one export-result.ndjson.
      params:
        annotations: export-result.ndjson
        images_dir: images
        geometry_labels: "SCALE"
    items: 1250
    items_note: >
      The only imagery whose pixels we own. THE moat, and it is small.
    annotations:
      - kind: instance-mask
        schema_id: reef-support-labelbox
        classes: 5
        supervises: [taxon]
        depth: L2
        notes: >
          Hard Coral, Soft Coral, Milleporid, Other Sessile Invertebrates, SCALE. Only
          Tayrona carries all five.
      - kind: polyline
        count: 654
        supervises: []
        notes: >
          SCALE lines (Tayrona only) - the supervision signal for metric-scale recovery.
    coverage:
      regions: [caribbean]
      ecoregions: ["Southwestern Caribbean", "Southern Caribbean"]
      sites: 4
    domain_shift:
      trained_regions: [caribbean]
      missing_classes:
        - "sand"
        - "rubble"
        - "rock / pavement"
        - "turf algae"
        - "crustose coralline algae"
      caveats:
        - "CRITICAL SUPERVISION HOLE: this corpus labels BIOTA only. It contains no Caribbean substrate ground truth of any kind - no sand, rubble, pavement, turf or CCA. Fixing the ontology makes soft coral EXPRESSIBLE but supplies no substrate examples, so it cannot on its own repair the ~32% rubble / ~50% unknown-hard-substrate collapse. That needs funded substrate annotation."
        - "Soft coral is ~24% of all our Caribbean/Atlantic annotations and absent from every major public reef schema."
    tags: [moat, caribbean, octocoral, biota-only]

  - id: reef-support-seaview-labels
    name: Reef Support annotations on XL Catlin Seaview imagery
    version: "2026-08"
    description: >
      Our expert instance masks drawn on PUBLIC XL Catlin Seaview photographs -
      SEAVIEW_PAC_AUS (808), SEAVIEW_PAC_USA (728), SEAVIEW_ATL (705), SEAVIEW_IDN_PHL
      (466). The annotation labour and the resulting masks are ours; the underlying pixels
      are not.
    licence: NO-LICENCE-STATED
    legal_basis: unknown
    provenance: partner
    verification:
      verified_on: 2026-08-17
      verified_by: "Live bucket manifest: 2,707 images across four SEAVIEW_* site directories. No XL Catlin Seaview licence or permission document located in the repo or bucket."
      method: absent
    access:
      method: s3
      uri: s3://rs-storage-open/benthic_datasets/mask_labels/reef_support
      params:
        bucket: rs-storage-open
        endpoint: hel1.your-objectstorage.com
        region: hel1
        prefix: benthic_datasets/mask_labels/reef_support/SEAVIEW_ATL/
        credentials_env: S3
    modalities: [image]
    capabilities:
      - benthic-segmentation
      - coral-instance-segmentation
      - general-pretraining
    loader:
      layout: labelbox-ndjson
      schema_id: reef-support-labelbox
      crosswalk_id: reef-support-labelbox
      params:
        annotations: export-result.ndjson
        images_dir: images
        geometry_labels: "SCALE"
      verified_on: 2026-08-29
      verified_note: "Live S3 fetch confirms images/ and export-result.ndjson at the declared prefix, matching the layout."
    items: 2707
    annotations:
      - kind: instance-mask
        schema_id: reef-support-labelbox
        classes: 2
        supervises: [taxon]
        depth: L2
        notes: "Hard Coral / Soft Coral. SEAVIEW_ATL is 46.9% Soft Coral - our strongest octocoral evidence."
    coverage:
      regions: [western-atlantic, caribbean, coral-triangle, central-pacific, gbr-australia]
      sites: 4
    notes: >
      SPLIT OUT 2026-08-17 after review. Previously these 2,707 images sat inside a single
      `reef-support-benthic` entry tiered PROPRIETARY-OWN, which meant the gate minted a
      clean T0_OWN certificate over imagery we do not own - precisely the false-provenance
      failure this registry exists to prevent, in our own data.

      Rights are now split at the partition level. Our MASKS are ours; the PIXELS are XL
      Catlin Seaview's and their terms are unconfirmed, so legal_basis is `unknown` and the
      gate blocks this everywhere until resolved. Resolve by confirming Seaview's terms in
      writing; if permissive, retier and record the primary source.

      Re-checked 2026-09-18 (s3://rs-storage-open/benthic_datasets/mask_labels/reef_support):
      no separate Seaview-imagery registry record exists to confirm terms from; still
      unresolved.
    tags: [needs-permission, annotation-ip, octocoral]

  - id: reef-support-bleaching
    name: Reef Support bleaching masks (Tayrona)
    version: "2026-08"
    description: >
      Paired bleached / non-bleached masks over the same 658 Tayrona images that carry
      benthic instance masks. The same pixels labelled on two axes — rare, and directly
      usable for a multi-task condition head.
    licence: PROPRIETARY-OWN
    legal_basis: own
    provenance: own
    verification:
      verified_on: 2026-08-17
      verified_by: "Live rclone scan of s3://rs-storage-open/coral_bleaching/reef_support/UNAL_BLEACHING_TAYRONA"
      method: licence-file
    access:
      method: s3
      uri: s3://rs-storage-open/coral_bleaching/reef_support/UNAL_BLEACHING_TAYRONA
      size_bytes: 1996000000
      params:
        bucket: rs-storage-open
        endpoint: hel1.your-objectstorage.com
        region: hel1
        prefix: coral_bleaching/reef_support/UNAL_BLEACHING_TAYRONA/
        credentials_env: S3
    modalities: [image]
    capabilities: [bleaching-assessment, benthic-segmentation]
    loader:
      layout: dual-condition-masks
      verified_on: 2026-08-28
      verified_note: >
        RESOLVED. The stems DO align (e.g. images/C10_..._corr.jpg pairs with
        masks_bleached/C10..._corr_bleached.png and masks_non_bleached/
        C10..._corr_non_bleached.png) — the previous "no stems aligned" failure was
        the single-masks_dir 'image-mask-pairs' layout looking for a plain "masks/"
        directory that has never existed, not a real misalignment. Pixel check
        against a live sample: masks_bleached and masks_non_bleached never mark the
        same pixel (verified on the fetched sample), so the two combine into one
        condition raster (0=unlabelled, 1=bleached, 2=non-bleached) with no
        information lost or invented. See DualConditionMaskLoader.
      params:
        positive_dir: masks_bleached
        negative_dir: masks_non_bleached
        positive_label: bleached
        negative_label: non_bleached
      schema_id: dataset-native
      crosswalk_id: reef-support-bleaching-condition
    items: 658
    annotations:
      - kind: dense-mask
        count: 1316
        supervises: [condition]
        notes: "Two mask sets per image: masks_bleached and masks_non_bleached."
    coverage:
      regions: [caribbean]
      ecoregions: ["Southern Caribbean"]
      years: [2024, 2024]
      sites: 1
    tags: [multi-task, caribbean]

