  - id: coralscop-masks-rs
    name: CoralSCOP pseudo-masks (our generation)
    version: "unversioned"
    description: >
      Masks generated by the CoralSCOP model over an image pool. Model output, not
      ground truth. Useful for weak supervision and pretraining only.
    licence: CC-BY-NC-SA-4.0
    legal_basis: licence
    provenance: auto
    verification:
      verified_on: 2026-08-17
      verified_by: "external/ai/CoralSCOP/LICENSE — CC BY-NC-SA 4.0, HKUST VGD"
      method: licence-file
    access:
      method: s3
      uri: s3://rs-storage-open/benthic_datasets/mask_labels/coralscop_masks
      size_bytes: 7871000000
      params:
        bucket: rs-storage-open
        endpoint: hel1.your-objectstorage.com
        region: hel1
        prefix: benthic_datasets/mask_labels/coralscop_masks/
        credentials_env: S3
    modalities: [image]
    capabilities: [coral-instance-segmentation, general-pretraining]
    items: 38928
    annotations:
      - kind: instance-mask
        count: 38928
        supervises: []
        notes: "Machine-generated. MUST NOT enter an evaluation split."
    coverage:
      regions: [unknown]
    notes: >
      Derived from an NC-SA model, so the output inherits the restriction. Retained for
      research and weak supervision; never in shipped weights.
    loader: { layout: metadata-only }
    tags: [pseudo-label, never-eval]
