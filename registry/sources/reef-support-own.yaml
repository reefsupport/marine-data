        `access.params.credentials_env` dropped: confirmed by direct HTTPS GET and by
        unsigned boto3 that `rs-storage-open` allows anonymous `GetObject` on a known
        key, so a credential requirement here only ever produced a false
        `unfetchable`.

        VERIFIED 2026-09-23 (S7j): `.venv/bin/marinedata verify reefolution --limit 5`
        now passes. The 7i blocker (every source on this bucket fetched by first
        listing its prefix, and anonymous `ListBucket` is `AccessDenied` even though
        `GetObject` is public) is closed by a manifest-driven fetch path
        (`marinedata.fetchers_remote._fetch_s3_manifest`, gated by
        `_is_pinned_staged_tree`): for a source pinned by `checksums.root_digest` with
        `layout: staged-tree`, the fetcher GETs `CHECKSUMS.sha256` by its known key,
        checks its sha256 against `root_digest`, then GETs and per-file-verifies only
        the files named in that manifest — no listing call at all. Bucket policy is
        unchanged (still no anonymous `ListBucket`); unpinned and credentialed sources
        still list as before.
