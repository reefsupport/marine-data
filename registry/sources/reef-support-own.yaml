# Counts are from a live rclone scan of the Hetzner buckets on 2026-08-17 and a full
# parse of every Labelbox export-result.ndjson — not from prior documentation.

sources:
  - id: reef-support-benthic-own
    name: Reef Support benthic instance masks — own imagery (Colombia)
    version: "2026-08"
    description: >
      Expert Labelbox instance masks over four Colombian sites where BOTH the imagery and
      the annotations are ours: Tayrona (658), Seaflower Bolivar (246), Seaflower Courtown
      (241), Tetes Providencia (105).
    licence: PROPRIETARY-OWN
    legal_basis: own
    redistribution: ok
    provenance: own
    verification:
      verified_on: 2026-08-17
      verified_by: "Live rclone scan of s3://rs-storage-open/benthic_datasets/mask_labels/reef_support; per-site image counts parsed from the object manifest"
      method: licence-file
    access:
      method: s3
      uri: s3://rs-storage-open/sources/reef-support-benthic-own/2026-08
      notes: "rs-storage-open is a public bucket — anonymously fetchable, no credentials needed"
      params:
        bucket: rs-storage-open
        endpoint: hel1.your-objectstorage.com
        region: hel1
        prefix: sources/reef-support-benthic-own/2026-08/
      size_bytes: 4092140433
    checksums:
      version: "2026-08"
      root_digest: f06d84ad4bc3ccb231610b0bf76507f8751bc958f0a917c2399737e9af9a9a52
      files: 2501
      size_bytes: 4091820228
    modalities: [image]
    capabilities:
      - benthic-segmentation
      - coral-instance-segmentation
      - general-pretraining
    loader:
      layout: staged-tree
      schema_id: reef-support-labelbox
      crosswalk_id: reef-support-labelbox
      verified_on: 2026-09-24
      verified_note: >
        PINNED 2026-09-24 (S8e): `access.uri`/`version` now point at the uploaded
        staged tree `sources/reef-support-benthic-own/2026-08/` (2,502 objects,
        4,092,140,433 B), pinned by `checksums.root_digest` (2,501 files,
        4,091,820,228 B). `access.params.credentials_env` dropped: `rs-storage-open`
        allows anonymous `GetObject` on a known key. Layout switched from
        labelbox-rgb to staged-tree — this tree was produced by this repo's own
        staging writers (`images/<site>/`, `metadata.parquet`, `labels/masks/`,
        `CHECKSUMS.sha256`), the shape `StagedTreeLoader` reads with no params.
        VERIFIED 2026-09-24: `.venv/bin/marinedata verify reef-support-benthic-own`
        passes via the manifest-driven fetch path (`fetchers_remote._fetch_s3_manifest`),
        which never lists the bucket.
    items: 1250
    items_note: >
      The only imagery whose pixels we own. THE moat, and it is small.
    annotations:
      - kind: instance-mask
        schema_id: reef-support-labelbox
        classes: 5
        supervises: [taxon]
        depth: L2
        notes: >
          Hard Coral, Soft Coral, Milleporid, Other Sessile Invertebrates, SCALE. Only
          Tayrona carries all five.
      - kind: polyline
        count: 654
        supervises: []
        notes: >
          SCALE lines (Tayrona only) - the supervision signal for metric-scale recovery.
    coverage:
      regions: [caribbean]
      ecoregions: ["Southwestern Caribbean", "Southern Caribbean"]
      sites: 4
    domain_shift:
      trained_regions: [caribbean]
      missing_classes:
        - "sand"
        - "rubble"
        - "rock / pavement"
        - "turf algae"
        - "crustose coralline algae"
      caveats:
        - "CRITICAL SUPERVISION HOLE: this corpus labels BIOTA only. It contains no Caribbean substrate ground truth of any kind - no sand, rubble, pavement, turf or CCA. Fixing the ontology makes soft coral EXPRESSIBLE but supplies no substrate examples, so it cannot on its own repair the ~32% rubble / ~50% unknown-hard-substrate collapse. That needs funded substrate annotation."
        - "Soft coral is ~24% of all our Caribbean/Atlantic annotations and absent from every major public reef schema."
    split_group:
      pattern: 'reef_support/([^/]+)/'
      match_field: upstream_path
      template: "rs-colombia/{group}"
    notes: >
      OWNERSHIP CONFIRMED 2026-09-23 (WS-D decision): this entry owns all four
      Colombian `mask_labels/reef_support/` directories (Tayrona, Seaflower Bolivar,
      Seaflower Courtown, Tetes Providencia) outright — both pixels and annotations
      are ours. `reef-support-seaview-labels` no longer claims any of these four; it
      is scoped to the SEAVIEW_* directories only.
    tags: [moat, caribbean, octocoral, biota-only]

  - id: reef-support-seaview-labels
    name: Reef Support annotations on XL Catlin Seaview imagery
    version: "2026-08"
    description: >
      Our expert instance masks drawn on reef photographs, across the four SEAVIEW_*
      site directories: SEAVIEW_ATL, SEAVIEW_IDN_PHL, SEAVIEW_PAC_AUS, SEAVIEW_PAC_USA.
      These are PUBLIC XL Catlin Seaview photographs. The annotation labour and the
      resulting masks are ours; the underlying pixels are XL Catlin Seaview's and
      their terms are unconfirmed.
    licence: NO-LICENCE-STATED
    legal_basis: unknown
    redistribution: unknown
    provenance: partner
    verification:
      verified_on: 2026-09-19
      verified_by: "2026-09-19 boto3 bucket listing (v4s-open-listing.tsv): 73,045 images across eight site directories under benthic_datasets/mask_labels/reef_support/, of which SEAVIEW_ATL, SEAVIEW_IDN_PHL, SEAVIEW_PAC_AUS and SEAVIEW_PAC_USA belong to this entry (WS-D decision, 2026-09-23) - the other four (SEAFLOWER_BOLIVAR, SEAFLOWER_COURTOWN, TETES_PROVIDENCIA, UNAL_BLEACHING_TAYRONA) belong to `reef-support-benthic-own`. No XL Catlin Seaview licence or permission document located in the repo or bucket."
      method: absent
    access:
      method: s3
      uri: s3://rs-storage-open/benthic_datasets/mask_labels/reef_support
      params:
        bucket: rs-storage-open
        endpoint: hel1.your-objectstorage.com
        region: hel1
        prefix: benthic_datasets/mask_labels/reef_support/SEAVIEW_ATL/
        credentials_env: S3
      size_bytes: 8121822251  # 2026-09-19 boto3 listing
    modalities: [image]
    capabilities:
      - benthic-segmentation
      - coral-instance-segmentation
      - general-pretraining
    loader:
      layout: labelbox-rgb
      schema_id: reef-support-labelbox
      crosswalk_id: reef-support-labelbox
      params:
        annotations: export-result-old.ndjson
        images_dir: images
        stitched_dir: masks_stitched
      verified_on: 2026-09-23
      verified_note: >
        WSD S6x/S7a: SEAVIEW_ATL's export-result.ndjson is the newer, lossy export (0
        objects for 320/705 images) - export-result-old.ndjson is the input that
        actually matches masks_stitched/ (705/705, spec §2a). labelbox-rgb decodes the
        fixed fill+outline colour LUT and cross-checks per image against the NDJSON.
    items: 73045
    items_note: >
      STALE 2026-09-23: this still totals all eight directories from the 2026-09-19
      listing. Per the WS-D ownership decision this entry now covers only the four
      SEAVIEW_* directories; the true per-directory split (and the Colombian-side
      total now owned by `reef-support-benthic-own`) needs a recount from the
      post-delete listing — deferred with the version-pin work (not this step).
    split_group:
      pattern: '^(.{5})'
      match_field: stem
      template: "seaview/{group}"
    annotations:
      - kind: instance-mask
        schema_id: reef-support-labelbox
        classes: 2
        supervises: [taxon]
        depth: L2
        notes: "Hard Coral / Soft Coral. SEAVIEW_ATL is 46.9% Soft Coral - our strongest octocoral evidence."
    coverage:
      regions: [western-atlantic, coral-triangle, central-pacific, gbr-australia]
      sites: 4
    notes: >
      SPLIT OUT 2026-08-17 after review. Previously these 2,707 images sat inside a single
      `reef-support-benthic` entry tiered PROPRIETARY-OWN, which meant the gate minted a
      clean T0_OWN certificate over imagery we do not own - precisely the false-provenance
      failure this registry exists to prevent, in our own data.

      Rights are now split at the partition level. Our MASKS are ours; the PIXELS are XL
      Catlin Seaview's and their terms are unconfirmed, so legal_basis is `unknown` and the
      gate blocks this everywhere until resolved. Resolve by confirming Seaview's terms in
      writing; if permissive, retier and record the primary source.

      Re-checked 2026-09-18 (s3://rs-storage-open/benthic_datasets/mask_labels/reef_support):
      no separate Seaview-imagery registry record exists to confirm terms from; still
      unresolved.

      Re-checked 2026-09-19 (boto3 listing): live prefix has grown from four SEAVIEW_* dirs
      / 2,707 images (recorded 2026-08-17) to eight dirs / 73,045 images - added
      SEAFLOWER_BOLIVAR, SEAFLOWER_COURTOWN, TETES_PROVIDENCIA, UNAL_BLEACHING_TAYRONA.

      RESOLVED 2026-09-23 (WS-D decision): the four added directories are Reef Support's
      OWN imagery, not XL Catlin Seaview's — ownership moved to `reef-support-benthic-own`,
      which already covered them (Tayrona, Seaflower Bolivar, Seaflower Courtown, Tetes
      Providencia) and keeps its existing PROPRIETARY-OWN/ok licence fields. This entry now
      covers only the four SEAVIEW_* directories, whose XL Catlin Seaview pixel terms remain
      unconfirmed; the "pixel origin not confirmed" language previously applied to the
      Colombian four is removed as no longer applicable to them.
    tags: [needs-permission, annotation-ip, octocoral]

  - id: reef-support-bleaching
