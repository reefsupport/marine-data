# Reef Support's own and partner data.
#
# Counts are from a live rclone scan of the Hetzner buckets on 2026-08-17 and a full
# parse of every Labelbox export-result.ndjson — not from prior documentation.

sources:
  - id: reef-support-benthic-own
    domain: coral
    access_class: open
    name: Reef Support benthic instance masks — own imagery (Colombia)
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [coral_reef]
    version: "2026-10-06"
    description: >
      Expert Labelbox instance masks over four Colombian sites where BOTH the imagery and
      the annotations are ours: Tayrona (658), Seaflower Bolivar (246), Seaflower Courtown
      (241), Tetes Providencia (105).
    licence:
      id: CC-BY-4.0
      name: Creative Commons Attribution 4.0
      tier: T1_PERMISSIVE
      url: https://creativecommons.org/licenses/by/4.0/
      flags: { attribution_required: true }
      notes: >
        D-B (Yohan 2026-09-25, by delegation): Reef Support's own imagery relicensed
        from PROPRIETARY-OWN to CC-BY-4.0 for the open dataset. set 2026-09-25 by
        delegation; confirmed 2026-10-02 (Yohan).
    legal_basis: own
    redistribution: ok
    provenance: own
    verification:
      verified_on: 2026-08-17
      verified_by: "Live rclone scan of s3://rs-storage-open/benthic_datasets/mask_labels/reef_support; per-site image counts parsed from the object manifest (legacy: history note)"
      method: licence-file
    access:
      method: s3
      uri: s3://rs-storage-open/sources/reef-support-benthic-own/2026-10-06
      notes: "rs-storage-open is a public bucket — anonymously fetchable, no credentials needed"
      params:
        bucket: rs-storage-open
        endpoint: hel1.your-objectstorage.com
        region: hel1
        prefix: sources/reef-support-benthic-own/2026-10-06/
    checksums:
      version: "2026-10-06"
      root_digest: 70f0b4516510f565320910477204faadf44bce68251b66d070821db1864e7a74
      files: 18276
      size_bytes: 4846131071
    modalities: [image]
    capabilities:
      - benthic-segmentation
      - coral-instance-segmentation
      - general-pretraining
    loader:
      layout: staged-tree
      schema_id: reef-support-labelbox
      crosswalk_id: reef-support-labelbox
      params:
        # WS-D S31: the dense mask under labels/masks/ is 0=unlabelled/1=Hard Coral/
        # 2=Soft Coral (verified against real pixels — every sampled mask is {0},
        # {0,1} or {0,1,2}, never a third value). Nothing resolved this before —
        # StagedTreeLoader only ever set mask_is_dense, never what the pixels mean —
        # so labels/taxon here are keyed on the sparse point annotations only; this
        # declares the mask's own pixel semantics for a consumer that wants them,
        # using the same native label strings ("Hard Coral"/"Soft Coral") the
        # crosswalk above already resolves from the point annotations.
        mask_values: "0=unlabelled,1=Hard Coral,2=Soft Coral"
      verified_on: 2026-09-24
      verified_note: >
        PINNED 2026-08-17 (S8e), RE-PINNED 2026-09-24 (WS-D S22): `access.uri`/`version`
        now point at the re-staged tree `sources/reef-support-benthic-own/2026-09-24/`
        (2,502 objects, 4,092,140,695 B), pinned by `checksums.root_digest` (2,501
        files, 4,091,820,490 B). Images/masks are byte-identical to the prior
        `2026-08/` pin (moved by server-side `copy_object`, no pixel re-upload,
        reused digests); only `metadata.parquet`'s `split_group` column and
        `CHECKSUMS.sha256` changed, for the station/bay `split_group` rule below.
        The old `2026-08/` prefix (2,502 objects, 4,092,140,433 B) is left in the
        open bucket pending a separate delete step. `access.params.credentials_env`
        dropped: `rs-storage-open` allows anonymous `GetObject` on a known key.
        Layout is staged-tree — this tree was produced by this repo's own staging
        writers (`images/<site>/`, `metadata.parquet`, `labels/masks/`,
        `CHECKSUMS.sha256`), the shape `StagedTreeLoader` reads. `loader.params.
        mask_values` added (WS-D S31): declares the dense mask's own pixel→native-
        label meaning (0=unlabelled/1=Hard Coral/2=Soft Coral), which nothing read
        before — `StagedTreeLoader` only ever set `mask_is_dense`.
        VERIFIED 2026-09-24: `.venv/bin/marinedata verify reef-support-benthic-own`
        passes via the manifest-driven fetch path (`fetchers_remote._fetch_s3_manifest`),
        which never lists the bucket.
    n_images: 1250
    n_annotations: 14517
    n_files: 18276
    annotations:
      - kind: instance-mask
        schema_id: reef-support-labelbox
        classes: 5
        supervises: [taxon]
        depth: L2
        notes: >
          Hard Coral, Soft Coral, Milleporid, Other Sessile Invertebrates, SCALE. Only
          Tayrona carries all five.
      - kind: polyline
        count: 654
        supervises: []
        notes: >
          SCALE lines (Tayrona only) - the supervision signal for metric-scale recovery.
    coverage:
      regions: [caribbean]
      ecoregions: ["Southwestern Caribbean", "Southern Caribbean"]
      sites: 4
    domain_shift:
      trained_regions: [caribbean]
      missing_classes:
        - "sand"
        - "rubble"
        - "rock / pavement"
        - "turf algae"
        - "crustose coralline algae"
      caveats:
        - "CRITICAL SUPERVISION HOLE: this corpus labels BIOTA only. It contains no Caribbean substrate ground truth of any kind - no sand, rubble, pavement, turf or CCA. Fixing the ontology makes soft coral EXPRESSIBLE but supplies no substrate examples, so it cannot on its own repair the ~32% rubble / ~50% unknown-hard-substrate collapse. That needs funded substrate annotation."
        - "Soft coral is ~24% of all our Caribbean/Atlantic annotations and absent from every major public reef schema."
    split_group:
      pattern: '(CB\d+|E\d+|BC|Gy|PB|Gr|P9150|G)'
      match_field: stem
      template: "rs-colombia/{partition}/{group}"
    notes: >
      OWNERSHIP CONFIRMED 2026-09-23 (WS-D decision): this entry owns all four
      Colombian `mask_labels/reef_support/` directories (Tayrona, Seaflower Bolivar,
      Seaflower Courtown, Tetes Providencia) outright — both pixels and annotations
      are ours. `reef-support-seaview-labels` no longer claims any of these four; it
      is scoped to the SEAVIEW_* directories only.
      RE-STAGED 2026-09-24 (WS-D S22, R3 Q9 + 7l): `split_group` moved from site-level
      (`rs-colombia/<site>`, 4 groups) to station/bay (`rs-colombia/<site>/<station>`,
      31 groups: Bolivar 7 — CB8/CB9/CB10/CB11/CB12/CB14 + one `P9150*` pair grouped
      together (no station code in those two stems) — Courtown 19 (E0..E21, 19 of 22
      present), Tayrona 4 (bays BC/Gy/PB/Gr), Tetes 1
      (one GoPro run, no station code in the stem). Site-level held out one Tetes
      GoPro run as `test` (52% of all SC pixels, 4% of HC); station/bay flattens the
      HC share across splits (22.9/22.1/21.5%) at the cost of Bolivar/Courtown
      stations straddling all 3 splits. `reef-support-seaview-labels`'s bleaching set
      and `rs_labelled` (via `images_from`) share this rule and pick it up unstaged. (legacy: history note)

      RE-POINTED 2026-10-06 (bucket reorganisation, RB-1/RB-3): canonical location is
      `sources/reef-support-benthic-own/2026-10-06/` (images + semantic masks of the 2026-09-24 tree,
      plus instance masks, stitched masks and Labelbox exports of the four Colombian sites under
      `labels/instance_masks/`, `labels/exports/`). `2026-09-24` and `2026-08` are SUPERSEDED (kept
      until RB-2 deletes byte-identical copies). `checksums` re-pinned 2026-10-06 (RB-3c) from the tree's
      CHECKSUMS.sha256 (RB-1 FINALIZED: 18,276 files = 18,273 objects + metadata.parquet, INGEST.json, LICENSE;
      1,250 image rows read back by the StagedTreeLoader).
      `n_annotations` = 14,517 instance masks (RB-A lineage count, 2026-10-06).
      The 658 Tayrona (UNAL) images are byte-identical to `reef-support-bleaching`'s 658 images.
    tags: [moat, caribbean, octocoral, biota-only]

