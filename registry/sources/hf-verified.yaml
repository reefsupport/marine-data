# Sources discovered on HuggingFace and confirmed loadable against live data.
#
# Every entry here was probed via the datasets-server before being written: features and
# splits were read from the real dataset rather than from its documentation. That is the
# difference between an entry that works and one that merely looks plausible.

sources:
  - id: reefnet-hf
    name: ReefNet 1.0 (HuggingFace release)
    version: "1.0"
    description: >
      The ReefNet fine-grained coral benchmark, published openly on HuggingFace as
      tabular point annotations: CoralNet source, image name, row/column, CoralNet
      label and a harmonised ReefNet label.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "HF dataset ReefNet/ReefNet-1.0 probed live; columns X, CoralNet_source, Image_name, Row, Column, CoralNet_label, CoralNet_label_short_code, Sorted_ReefNet_label"
      method: dataset-card
    access:
      method: huggingface
      uri: https://huggingface.co/datasets/ReefNet/ReefNet-1.0
      size_bytes: 4161666984  # measured 2026-09-18
      params:
        hf_id: ReefNet/ReefNet-1.0
    modalities: [tabular]
    capabilities: [coral-taxonomy, benthic-classification]
    items: 181223
    annotations:
      - kind: point-label
        count: 925000
        schema_id: worms-genus
        supervises: [taxon]
        depth: L3
    coverage:
      regions: [global, central-pacific, red-sea]
    domain_shift:
      trained_regions: [central-pacific, red-sea]
      caveats:
        - "This release is the ANNOTATION TABLE, not the imagery. Images must be retrieved per CoralNet source."
        - "Caribbean/Brazil under 8k annotations each - the bias that makes our region valuable."
    loader:
      layout: metadata-only
      verified_note: >
        Probed live 2026-08-17. Tabular annotations only, with no image column, so there
        is no sample-level image loader. Supersedes the earlier 'request only' entry -
        the data is open, just not as imagery.
    citation: "Felemban, Battach, Khan et al., ReefNet, KAUST + MIT, arXiv 2510.16822"
    tags: [genus, benchmark, tabular]

  - id: reefnet-species-images
    name: ReefNet species images
    version: "unversioned"
    description: Coral species image classification set derived from the ReefNet corpus.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "HF dataset BobDerBaum/reefnet_species_images probed live; features image:Image, label:ClassLabel"
      method: dataset-card
    access:
      method: huggingface
      uri: https://huggingface.co/datasets/BobDerBaum/reefnet_species_images
      size_bytes: 283236711706  # measured 2026-09-18
      params: { hf_id: BobDerBaum/reefnet_species_images, image_column: image, label_column: label }
    modalities: [image]
    capabilities: [general-pretraining]
    annotations:
      - kind: image-label
        classes: 2
        supervises: []
        notes: >
          CORRECTED 2026-08-17 by a label audit against live data. This was registered as
          genus-level species labels (schema worms-genus, depth L3). It is not. The
          `label` column is a ClassLabel with TWO values - 'Cape Maeda2021' and
          'Capstone 2023' - which are SURVEY/COLLECTION names, not taxa, and the value is
          null on at least some rows.

          The dataset name promises species; the data does not deliver them. Downgraded
          to general-pretraining with no taxon supervision.
    coverage: { regions: [global] }
    loader:
      layout: image-folder
      verified_on: 2026-08-17
      verified_note: >
        12 live rows fetched from HF; image+ClassLabel materialise as class-per-directory.
        A label audit then showed the ClassLabel carries collection names, not species -
        see the annotations note.
      schema_id: dataset-native
    citation: "@article{reefnet2024, title={ReefNet: A Large-Scale Coral Reef Annotation Dataset}, year={2024}, note={https://huggingface.co/datasets/ReefNet/ReefNet-1.0}}"
    tags: [pretraining, mis-registered-corrected]

  - id: reef-guidance-system
    name: QUT reef guidance system imagery
    version: "unversioned"
    description: >
      Underwater reef imagery from the QUT Centre for Robotics underwater-perception
      group - the lab behind the Raine & Fischer 2025 survey and the point-label-aware
      superpixel line of work.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "HF dataset QCR-Underwater-Perception/reef-guidance-system probed live; feature image:Image"
      method: dataset-card
    access:
      method: huggingface
      uri: https://huggingface.co/datasets/QCR-Underwater-Perception/reef-guidance-system
      size_bytes: 31982049423  # measured 2026-09-18
      params: { hf_id: QCR-Underwater-Perception/reef-guidance-system, image_column: image }
    modalities: [image]
    capabilities: [general-pretraining, benthic-segmentation]
    annotations: [{ kind: none, supervises: [] }]
    coverage: { regions: [gbr-australia] }
    domain_shift:
      caveats: ["Unlabelled in this release - a pretraining and robotics-perception corpus."]
    loader:
      layout: flat-images
      verified_on: 2026-08-17
      verified_note: "15 live rows fetched from HF; images only"
    citation: "Raine, S., Olivastri, E., Moshirian, B., & Fischer, T. (2026). AI-driven dispensing of coral reseeding devices for broad-scale restoration of the Great Barrier Reef. IEEE/RSJ International Conference on Intelligent Robots and Systems."
    tags: [robotics, pretraining, qut]

  - id: marrs-reef-soundscapes
    name: MARRS global coral reef soundscapes
    version: "unversioned"
    description: >
      Global reef soundscape detections with sonotype, country and confidence - the
      largest openly available reef bioacoustics corpus we have found.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "HF dataset bens-bots/marrs-global-coral-reef-soundscapes probed live; config detections_australia, features audio:Audio, filename, country, sonotype, logit, start_s"
      method: dataset-card
    access:
      method: huggingface
      uri: https://huggingface.co/datasets/bens-bots/marrs-global-coral-reef-soundscapes
      size_bytes: 10128808016  # measured 2026-09-18
      params:
        hf_id: bens-bots/marrs-global-coral-reef-soundscapes
        config: detections_australia
        audio_column: audio
        label_column: sonotype
      notes: >
        Measured 2026-09-18: 10,128,808,016 bytes is for config `detections_australia`
        only. The whole HF repo (all configs, all countries) is approximately 975 GB.
    modalities: [audio]
    capabilities: [bioacoustics]
    annotations: [{ kind: audio-event, supervises: [taxon] }]
    coverage: { regions: [global, gbr-australia] }
    domain_shift:
      caveats:
        - "Multi-config by country; `detections_australia` is one of several. Set `config` per region."
        - "Labels are sonotypes (sound classes), not species - the mapping from sound to source organism is largely unsolved."
    loader:
      layout: audio-clips
      verified_on: 2026-08-17
      verified_note: "15 live audio clips fetched from HF config detections_australia; sonotype as class dir"
      schema_id: sonotype
    citation: "Williams et al. (2025) Evidence of ecosystem process recovery across a large-scale coral reef restoration programme using AI accelerated soundscape analysis, https://doi.org/10.1101/2025.09.24.678197 || Williams, Ben; Jones, Kate (2025). Coral Reef Soundscapes from a Global Restoration Programme. University College London. Dataset. https://doi.org/10.5522/04/29958062.v2"
    tags: [bioacoustics, reef-audio, multi-region]

