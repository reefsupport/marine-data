  - id: satellite-coral-mapping
    name: AIMS satellite coral mapping
    version: "unversioned"
    description: >
      Paired Sentinel-2 / Landsat-8 reef scenes with label rasters, from AIMS - a rare
      satellite reef set published with ground-truth labels rather than as a product.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "HF dataset aimsks/satellite-coral-mapping probed live; split test, features label:Image, Coral-Sea_S2_R2:Image, Coral-Sea_L8_R1:Image, Coral-Sea_S2_R1:Image"
      method: dataset-card
    access:
      method: huggingface
      uri: https://huggingface.co/datasets/aimsks/satellite-coral-mapping
      size_bytes: 30434265  # measured 2026-09-18
      params:
        hf_id: aimsks/satellite-coral-mapping
        split: test
        image_column: Coral-Sea_S2_R1
        mask_column: label
    modalities: [satellite, image]
    capabilities: [habitat-mapping-satellite, benthic-segmentation]
    annotations: [{ kind: dense-mask, supervises: [taxon] }]
    coverage: { regions: [gbr-australia] }
    domain_shift:
      caveats:
        - "Coral Sea only. Satellite resolution maps habitat extent, not colony condition."
        - "Multiple sensor columns (S2_R1, S2_R2, L8_R1) share one label raster - pick the sensor deliberately."
    loader:
      layout: image-mask-pairs
      verified_on: 2026-08-17
      verified_note: "15 live rows fetched from HF split=test; Coral-Sea_S2_R1 paired with label raster"
      schema_id: dataset-native
    tags: [satellite, aims, paired-labels]
