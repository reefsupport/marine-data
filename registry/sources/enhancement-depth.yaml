      caveats: ["Synthetic. Useful for pipeline validation with perfect ground truth; the sim-to-real gap underwater is large."]
    loader: { layout: metadata-only }
    citation: "Peder Georg Olofsson Zwilgmeyer, Mauhing Yip, Andreas Langeland Teigen, Rudolf Mester, & Annette Stahl. (2021). The VAROS Synthetic Underwater Data Set: Towards realistic multi-sensor underwater data with ground truth (Version Varos - version 1 (currently only downloadable from windows systems)) [Dataset]. Zenodo. https://doi.org/10.5281/ZENODO.5567209"
    tags: [synthetic, permissive]

  - id: flsea
    domain: imaging
    access_class: restricted-nc
    name: FLSea (visual-inertial and stereo)
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [mixed]
    version: "2022"
    description: Forward-looking underwater depth ground truth with IMU and poses.
    licence: CC-BY-NC-SA-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "Kaggle viseaonlab/flsea-vi — CC BY-NC-SA 4.0"
