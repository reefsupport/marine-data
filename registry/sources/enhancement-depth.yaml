    tags: [depth, benchmark, noncommercial]

  - id: suim
    domain: fish
    access_class: open
    name: SUIM (Semantic Segmentation of Underwater Imagery)
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [mixed]
    version: "2020"
    description: 8-class underwater semantic segmentation — fish, reef, diver, wrecks, seafloor.
    licence: MIT
    legal_basis: licence
    redistribution: ok
    provenance: public
    checksums:
      version: "2020"
      root_digest: f7a9ea260f37ead52c20990bfc88b11c10b20dce96faa84a8f477e6f259aba95
      files: 3200
      size_bytes: 178204379
    verification:
      verified_on: 2026-08-29
      verified_by: >
        raw.githubusercontent.com/IRVLab/SUIM/master/LICENSE — the dataset's own repo
        LICENSE file, headed "SUIM-Net: Semantic Segmentation of Underwater Imagery:
        Dataset and Benchmark" (naming the dataset explicitly, not just generic
        "Software"), covering the whole repo including its `data/` directory.
        Corrected from CC-BY-4.0, which had no supporting primary source.
      method: licence-file
    access:
      method: s3
      uri: s3://rs-storage-open/sources/suim/2020/
      size_bytes: 178515331  # verified S62 2026-09-25, size+md5==ETag every object, CHECKSUMS.sha256 uploaded last
      params:
        bucket: rs-storage-open
        endpoint: hel1.your-objectstorage.com
        region: hel1
        prefix: sources/suim/2020/
        sample_url: https://huggingface.co/datasets/SatwikKambham/suim/resolve/main/SUIM.zip
      notes: >
        S62 (2026-09-25): staged the local suim/2020 tree (already in the
        StagedImage/staged-tree convention — images/, labels/masks/,
        metadata.parquet, CHECKSUMS.sha256) and uploaded it to our own durable copy
        on rs-storage-open, verified object-by-object (size + md5 == ETag),
        CHECKSUMS.sha256 uploaded only after every other object verified clean.
        `loader.layout` moved to `staged-tree` accordingly — no anonymous
        `ListBucket` needed for a live `fetch`/`verify`, only `GetObject` on known
        keys. The original upstream re-host (sample_url below) is kept as
        provenance, not the current read path. The official host only offers a
        2.85GB Google Drive link; sample_url is a third-party HuggingFace re-host of
        the same archive (166MB) — the full train_val split, not a trimmed sample.
        2026-09-18 (brief D2c): staged bytes came from this re-host
        (huggingface.co/datasets/SatwikKambham/suim), not the authors' own release
        (irvlab.cs.umn.edu → Google Drive) — SOURCE.json records this as
        fetched_uri. The re-host converted the authors' RGB masks to the 0-7 class
        indices this pipeline consumes; its jpg re-encoding of the images is
        unverified.
    modalities: [image]
    capabilities: [benthic-segmentation, fish-detection, general-pretraining]
    items: 1598
    annotations: [{ kind: dense-mask, classes: 8, supervises: [taxon] }]
    coverage: { regions: [global] }
    domain_shift:
      caveats: ["Coarse 8-class scheme — a scene-understanding baseline, not a benthic-cover asset."]
    loader:
      layout: staged-tree
      schema_id: dataset-native
      crosswalk_id: suim-8class
      verified_on: 2026-09-25
      verified_note: >
        S62 (2026-09-25): layout moved from `image-mask-pairs` (raw
        SUIM/train_val/{images,masks}/ dirs) to `staged-tree` (own bucket copy) —
        the staged tree's metadata.parquet marks each row's `upstream_split`
        (`train_val`: 1488, `TEST`: 110), so the upstream benchmark split survives
        the move; see the source-level `tags: [..., benchmark-test]` below, which
        flags the TEST rows for WP-11 routing. Real ingest confirmed
        SUIM/train_val/{images,masks}/ (1488 pairs) plus a separate SUIM/TEST/
        split (110 pairs) — 1598 items total, image↔mask pairing exact, no
        unpaired files. Masks are palette-indexed .bmp files (not .png) in the
        upstream distribution, values 0-7 — see registry/crosswalks/suim-8class.yaml
        for the index table.
    tags: [scene-understanding, baseline, benchmark-test]
