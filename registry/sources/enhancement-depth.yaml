# Underwater image enhancement, depth and stereo.
#
# A standing caution that belongs with every entry here: peer-reviewed evidence finds
# blanket underwater image enhancement is neutral-to-slightly-harmful for downstream
# detection and segmentation. Enhancement metrics (UIQM, UCIQE) measure how a human
# perceives an image, not how a model performs on it. Validate on the actual task.

sources:
  - id: uieb
    domain: imaging
    access_class: internal-only
    name: UIEB (Underwater Image Enhancement Benchmark)
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [mixed]
    version: "2019"
    description: Reference-paired real underwater images — the standard enhancement benchmark.
    licence: PROVENANCE-DEFECTIVE
    legal_basis: unknown
    redistribution: prohibited
    provenance: public
    verification:
      verified_on: 2026-08-29
      verified_by: >
        li-chongyi.github.io/proj_benchmark.html — the author's own project page —
        states in terms that leave no room for the "flagged non-commercial" secondary
        reading this previously relied on: "This UIEB dataset is used only for
        academic purposes. The re-distribution of this dataset is forbidden!!!" (their
        emphasis), with access gated behind a stated password and "one and only
        download port". The registry's access path is `Hikari0608/UIEB` on Hugging
        Face — an unrelated uploader with no dataset card, no licence statement, and no
        visible connection to the original authors (Chongyi Li's team). Given the
        author's own explicit prohibition on redistribution, this mirror is very
        likely exactly the unauthorized-redistribution pattern MarineInst20M was
        caught on: a rights holder who forbids redistribution does not stop meaning it
        because a third party did it anyway. Corrected from CC-BY-NC-4.0 (which
        permits redistribution with attribution) to provenance-defective — no
        redistribution channel this registry can point at is known to be authorized.
      method: site-terms
    access:
      method: huggingface
      uri: https://huggingface.co/datasets/Hikari0608/UIEB
      size_bytes: 1487878112  # measured 2026-09-18
      params:
        hf_id: Hikari0608/UIEB
        image_column: raw
        mask_column: gt
      notes: >
        Checked 2026-08-28 (prior pass): the official page only offers Google
        Drive/Baidu links gated behind a password; Kaggle mirrors also require an
        authenticated account+API-key. Hikari0608/UIEB matched the original count
        (890) exactly, which is why it was adopted — but a matching count is not
        evidence of authorization, and the author's own page explicitly forbids
        redistribution. Retained here only as a factual record of what this access
        path is; the licence gate now blocks it regardless of profile.
    modalities: [image]
    capabilities: [image-enhancement]
    items: 890
    annotations: [{ kind: none, supervises: [] }]
    coverage: { regions: [global] }
    notes: >
      PROHIBITED — not for a defective licence GRANT (the author's own terms are
      clear: personal/academic use, no redistribution), but because the only working
      access path in this registry is a third-party Hugging Face mirror with no
      visible authorization from the author, whose page explicitly forbids reposting.
      We cannot receive better title than that mirror had. If data is obtained
      directly from the author (li-chongyi.github.io, password-gated), that channel
      would be RESEARCH-ONLY-NO-REDIST, not this.
    loader:
      layout: image-mask-pairs
      params: { images_dir: images, masks_dir: masks }
      verified_on: 2026-08-28
      verified_note: "Live HF fetch confirms paired raw/gt images, images/ + masks/ on disk."
    tags: [enhancement, noncommercial]

  - id: squid
    domain: imaging
    access_class: restricted-nc
    name: SQUID (Stereo Quantitative Underwater Image Dataset)
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [mixed]
    version: "2019"
    description: Stereo underwater images with distance information and colour charts.
    licence: CC-BY-NC-SA-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-29
      verified_by: >
        zenodo.org/api/records/5744037 (the dataset's own official host, Zenodo API
        metadata) — `"license": "cc-by-nc-sa-4.0"`. Corrected from CC-BY-4.0: this
        reproduces the exact NC+SA-missed pattern already caught once on
        MarineInst20M — a plain CC-BY reading would have let a NonCommercial,
        ShareAlike-restricted source through as if it were unrestricted.
      method: dataset-card
    access:
      method: http
      uri: https://csms.haifa.ac.il/profiles/tTreibitz/datasets/ambient_forwardlooking/index.html
      size_bytes: 45817907950  # measured 2026-09-18
      notes: >
        Checked 2026-08-28: the original Haifa page's Dropbox links are flaky; the
        dataset is more reliably hosted on Zenodo (record 5744037), one .zip per site
        (Satil.zip 6.2GB, the smallest of four; the others run 10.5–16.9GB). No
        subset is published anywhere. Fetch a site archive manually.
    modalities: [image]
    capabilities: [image-enhancement, depth-estimation]
    items: 57
    annotations: [{ kind: depth-map, supervises: [] }]
    coverage: { regions: [mediterranean, red-sea] }
    notes: "Tiny but carries in-scene colour charts and distances — one of the few sets with physical ground truth."
    loader: { layout: image-mask-pairs, params: { images_dir: images, masks_dir: depth } }
    citation: 'Berman, Dana, Deborah Levy, Shai Avidan, and Tali Treibitz. "Underwater Single Image Color Restoration Using Haze-Lines and a New Quantitative Dataset." IEEE Transactions on Pattern Analysis and Machine Intelligence (2020).'
    tags: [stereo, physical-gt]

  - id: varos
    domain: imaging
    release_skip_reason: "no-staged-images: registry lists imagery, nothing staged under sources/ in rs-storage-open (U7/queue follow-up)"
    access_class: open
    name: VAROS synthetic underwater dataset
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [mixed]
    version: "2021"
    description: Physically-rendered synthetic sequences with depth, normals, poses and IMU.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "Zenodo record 5567209 — CC-BY 4.0"
      method: dataset-card
    access:
      method: zenodo
      uri: https://zenodo.org/records/5567209
      size_bytes: 17961673075  # measured 2026-09-18
    modalities: [image, video]
    capabilities: [depth-estimation, pose-slam]
    annotations: [{ kind: depth-map, supervises: [] }]
    coverage: { regions: [synthetic] }
