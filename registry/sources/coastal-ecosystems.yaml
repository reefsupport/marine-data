# Mangrove, seagrass, saltmarsh, bathymetry, debris — the non-reef coastal ecosystems.
#
# Mostly satellite and raster products. They are context layers rather than training
# sets: habitat *extent* and environmental stress, not organism condition. Several are
# `metadata-only` by design — declaring that is more honest than leaving `loader` unset
# and implying an adapter is merely missing.

sources:
