  - id: seaclear-marine-debris
    domain: imaging
    access_class: open
    name: SeaCLEAR Marine Debris
    # habitat inferred (WP-2b) from this source's own description/notes, not independently verified
    habitat: [mixed]
    version: "2024"
    description: Underwater debris and marine-life instance segmentation, 40 categories.
    licence: CC-BY-4.0
    legal_basis: licence
    redistribution: ok
    provenance: public
    verification:
      verified_on: 2026-08-17
      verified_by: "Nature Scientific Data s41597-024-03759-2 — CC-BY 4.0"
      method: dataset-card
    access:
      method: http
      uri: https://www.nature.com/articles/s41597-024-03759-2
      size_bytes: 1711829309
      notes: >
        Checked 2026-08-28: the paper's Data Availability statement points to 4TU
        ResearchData (DOI 10.4121/4f1dff25-...), reachable and unauthenticated — but
        the only file is a single 1.7GB .rar (per the publisher's own description:
        images/ organised one folder per site-camera pair, plus a COCO annotations.json
        — matches this entry's coco-json layout in principle). Not fetchable
        automatically: this project reads .zip/.tar via the standard library only, and
        adding RAR support means a new external dependency (rarfile + a system
        unrar/unar binary) for exactly one source. Fetch manually, or re-host as .zip.
    modalities: [image]
    capabilities: [marine-debris, general-pretraining]
    items: 8610
    annotations: [{ kind: instance-mask, classes: 40, supervises: [taxon] }]
    coverage: { regions: [mediterranean] }
    domain_shift:
      caveats: ["Mediterranean temperate — useful for the debris classes and for general underwater pretraining, not for reef taxa."]
    loader:
      layout: coco-json
      schema_id: dataset-native
      crosswalk_id: seaclear-marine-debris
      params:
        recursive_images: true
      verified_on: 2026-08-30
      verified_note: >
        Confirmed by extracting dataset.json and a real image from the archive
        (2026-08-30, using `unar` for manual inspection only — RAR support was
        deliberately not added to fetch.py, see access.notes): the COCO JSON's
        `file_name` fields are bare filenames ("1.jpg"), not the real sub-paths —
        images actually live under per-site-camera directories
        (Bistrina/Bluerobotics HD/1.jpg, Lokrum/SIP-E323CV/2.jpg, ...). All 8,610
        filenames are globally unique across every site, so `recursive_images`
        (new) resolves each one by searching the whole tree rather than joining a
        single images_dir directly, which would have silently pointed at the wrong
        site's same-named file or found nothing. 40 categories, 31,555 bbox+polygon
        annotations confirmed in the JSON, matching this entry's declared
        instance-mask/40-class annotation.
    citation: "Đuraš, A., Wolf, B. J., Ilioudi, A., Palunko, I., & De Schutter, B. (2024). A Dataset for Detection and Segmentation of Underwater Marine Debris in Shallow Waters. Scientific Data, 11(1). https://doi.org/10.1038/s41597-024-03759-2"
    tags: [debris, permissive]

