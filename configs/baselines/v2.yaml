# P5 baselines config (design §4.4/§4.5). Weights pinned by HF revision sha, fetched
# anonymously — no token, no login (D-AA).
backbones:
  - id: dinov2-small
    kind: hf_transformers
    hf_id: facebook/dinov2-small
    revision: ed25f3a31f01632728cabb09d1542f84ab7b0056
    licence: Apache-2.0
    feature_dim: 768
  - id: openclip-vitb16
    kind: open_clip
    hf_id: laion/CLIP-ViT-B-16-laion2B-s34B-b88K
    revision: 7288da5a0d6f0b51c4a2b27c624837a9236d0112
    licence: MIT
    feature_dim: 1536

preprocess:
  resize_short_side: 256
  center_crop: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

probe:
  solver: lbfgs
  multi_class: multinomial
  max_iter: 1000
  c_grid: [0.01, 0.1, 1.0, 10.0]
  train_cap: 100000
  seed: 0

finetune:
  unfrozen_blocks: 4
  lr_backbone: 5.0e-5
  lr_head: 1.0e-3
  weight_decay: 0.05
  warmup_epochs: 1
  epochs: 10 # full v2 build; P5's own run overrides to 1 on the smallest task only
  batch_size: 64
  seeds: [0, 1, 2]
  precision: { mps: fp32, cuda: bf16 }

# P5's probe tasks (manager decision, 2026-09-25): bleaching + benthic-coarse (both
# real ML targets) plus source-id as a pure leakage sanity check, not a shipped task.
tasks:
  - id: bleaching-condition
    lineage: bleaching-family-v1
    filter: { label_status: [ok] } # D-U2
    task_type: cls
  - id: benthic-coarse
    view: single-label # D-Z
    task_type: cls
  - id: source-id-domain
    task_type: cls
    note: leakage sanity check only — never a card-table row

reproduce:
  fixture_n_images: 2000
  tolerance_pt: 0.5 # design §5 acceptance criterion for `eval reproduce`
