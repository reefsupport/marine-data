[project]
name = "marinedata"
version = "0.1.0"
description = "Licence-aware registry and dataloaders for marine and coral-reef datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Reef Support B.V." }]
keywords = ["marine", "coral-reef", "benthic", "dataset", "licence", "croissant"]
dependencies = [
    "pyarrow>=15",  # release label gate reads the pinned WoRMS snapshot (WP-7)
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
torch = ["torch>=2.2", "numpy>=1.24", "pillow>=10.0"]
tf = ["tensorflow>=2.15"]
hf = ["datasets>=2.18"]
ingest = ["pyarrow>=15", "pillow==12.3.0"]
quality = ["numpy==2.4.6", "pillow==12.3.0", "opencv-python-headless==5.0.0.93", "pyarrow>=15"]
croissant = ["mlcroissant>=1.0", "pyarrow>=15"]
privacy = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "pyarrow>=15",
]
geo = ["shapely>=2.0"]
verify = ["boto3>=1.34", "pyarrow>=15"]
eval = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "pycocotools>=2.0.7",
]
all = ["pandas>=2.0", "torch>=2.2", "numpy>=1.24", "pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "ruff==0.16.3",
    "mypy>=1.9",
    "pandas>=2.0",
    "numpy==2.4.6",
    "pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "pyarrow>=15",
    "mlcroissant>=1.0",
    "cffconvert>=2.0",
    "boto3>=1.34",
    "moto>=5.0",
    "datasets>=2.18",
    "webdataset>=0.2.90",
]

[project.urls]
Homepage = "https://github.com/reefsupport/marine-data"
Source = "https://github.com/reefsupport/marine-data"

[project.scripts]
marinedata = "marinedata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marinedata"]

[tool.hatch.build.targets.wheel.force-include]
"registry" = "marinedata/_registry"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# `taxon × form × condition` is core vocabulary in this project, not a typo.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the network; set MARINEDATA_INTEGRATION=1 to run",
    "slow: needs the real _hf/v1 build on disk; skips cleanly when absent",
]
addopts = "-ra --strict-markers -m 'not integration'"
