[project]
name = "marinedata"
version = "0.1.0"
description = "Licence-aware registry and dataloaders for marine and coral-reef datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Reef Support B.V." }]
keywords = ["marine", "coral-reef", "benthic", "dataset", "licence", "croissant"]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
torch = ["torch>=2.2", "numpy>=1.24", "pillow>=10.0"]
tf = ["tensorflow>=2.15"]
hf = ["datasets>=2.18"]
ingest = ["pyarrow>=15", "pillow==11.0.0", "boto3>=1.34"]
# WP-6d-B payload decoders: video/rosbag frame extraction, rar/multipart-tar archives,
# caption/VQA JSON. ffmpeg and bsdtar are shelled out to (system binaries, not pip
# deps); imageio-ffmpeg is only imported as a fallback when `ffmpeg` isn't on PATH.
decoders = ["pillow==11.0.0", "rosbags>=0.10", "imageio-ffmpeg>=0.5"]
all = ["pandas>=2.0", "torch>=2.2", "numpy>=1.24", "pillow>=10.0"]
dev = ["pytest>=8.0", "ruff==0.16.3", "mypy>=1.9", "pandas>=2.0", "numpy>=1.24", "pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/reefsupport/marine-data"
Source = "https://github.com/reefsupport/marine-data"

[project.scripts]
marinedata = "marinedata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marinedata"]

[tool.hatch.build.targets.wheel.force-include]
"registry" = "marinedata/_registry"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# `taxon × form × condition` is core vocabulary in this project, not a typo.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the network; set MARINEDATA_INTEGRATION=1 to run",
]
addopts = "-ra --strict-markers -m 'not integration'"
