[project]
name = "marinedata"
version = "0.1.0"
description = "Licence-aware registry and dataloaders for marine and coral-reef datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Reef Support B.V." }]
keywords = ["marine", "coral-reef", "benthic", "dataset", "licence", "croissant"]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "numpy>=1.24"]
hf = ["datasets>=2.18"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]

[project.urls]
Homepage = "https://github.com/reefsupport/marine-data"
Source = "https://github.com/reefsupport/marine-data"

[project.scripts]
marinedata = "marinedata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marinedata"]

[tool.hatch.build.targets.wheel.force-include]
"registry" = "marinedata/_registry"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# `taxon × form × condition` is core vocabulary in this project, not a typo.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the network; set MARINEDATA_INTEGRATION=1 to run",
]
addopts = "-ra --strict-markers -m 'not integration'"
