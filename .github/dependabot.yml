# Version updates for the Python dependencies and the GitHub Actions the workflows use.
# Weekly, one grouped pull request per ecosystem. Exact pins (pillow, numpy, ruff, opencv) are
# bumped on purpose, so review the group before merging; `uv.lock` is regenerated by hand.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
