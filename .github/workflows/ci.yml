name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:00 UTC nightly — the only trigger that runs verify-layouts below.
    - cron: "0 3 * * *"

jobs:
  lint-and-test:
    # Runs on every push/PR and also on the nightly schedule, so `make ci` (lint,
    # registry check, full pytest incl. the D12 e2e fixture) still runs nightly
    # alongside the network-touching verify-layouts job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv && uv pip install -e ".[all,ingest,hf,dev]"
      - name: Test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make ci

  # Layout verification hits the network, so it runs nightly rather than per-commit.
  # It is what catches a declared layout drifting from the real dataset.
  #
  # Failure policy: `test_declared_layout_matches_reality` (tests/test_integration.py)
  # distinguishes the two ways a source can come back not-verified. A network/fetch
  # failure (host unreachable, timeout, 5xx, DNS) skips — that is an upstream blip, not
  # a declaration bug. A fetch that succeeds but whose declared layout does not match
  # reality fails — that is exactly the signal this job exists to carry, so it is
  # allowed to redden the scheduled run rather than being trained around.
  verify-layouts:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Verify declared layouts against live samples
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv && uv pip install -e ".[dev]"
          MARINEDATA_INTEGRATION=1 uv run pytest -q -m integration
