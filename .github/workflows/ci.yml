name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:00 UTC nightly — the only trigger that runs verify-layouts below.
    - cron: "0 3 * * *"

jobs:
  lint-and-test:
    # Runs on every push/PR and also on the nightly schedule, so `make ci` (lint,
    # registry check, full pytest incl. the D12 e2e fixture) still runs nightly
    # alongside the network-touching verify-layouts job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv && uv pip install -e ".[all,ingest,hf,dev]"
      - name: Test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make ci

  # Layout verification hits the network, so it runs nightly rather than per-commit.
  # It is what catches a declared layout drifting from the real dataset.
  #
  # Failure policy: `continue-on-error` because `test_declared_layout_matches_reality`
  # (tests/test_integration.py) asserts per-source, one dead upstream fails that test
  # and turns pytest's exit code non-zero — `verify_source` itself already reports a
  # dead fetch as a "failed" VerifyResult rather than raising, so the fetch layer is
  # already per-source-tolerant, but the test's assertion is not. `continue-on-error`
  # stops that non-zero from reddening the scheduled run: the job still executes, still
  # prints every source's status in the log, but reports as a neutral/warning check
  # rather than blocking anything on the default branch. An upstream outage should be
  # investigated, not trained-around by ignoring a routinely-red job.
  verify-layouts:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Verify declared layouts against live samples
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv && uv pip install -e ".[dev]"
          MARINEDATA_INTEGRATION=1 uv run pytest -q -m integration
